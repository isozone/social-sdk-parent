# PostgreSQL profile — 三选一实现之一
# 启动：java -jar xianyu-manager.jar --spring.profiles.active=postgres \
#   --DB_URL=jdbc:postgresql://localhost:5432/xianyu_manager \
#   --DB_USERNAME=xianyu --DB_PASSWORD=yourpass
#
# Docker 部署 PostgreSQL：
#   docker run -d --name xianyu-pg \
#     -e POSTGRES_USER=xianyu \
#     -e POSTGRES_PASSWORD=yourpass \
#     -e POSTGRES_DB=xianyu_manager \
#     -p 5432:5432 postgres:16
# 方言开关：触发 PostgresProvider 的 @ConditionalOnProperty(prefix="bitefu.wall", name="db-type", havingValue="postgres")。
# 不设的话 SqliteProvider 兜底激活，把 SQLite 的 PRAGMA 注入到 PG 连接里报语法错。
bitefu:
  wall:
    db-type: postgres

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xianyu_manager}
    username: ${DB_USERNAME:xianyu}
    password: ${DB_PASSWORD:}
    # 覆盖 application.yml 的 SQLite wall filter 配置：
    # 不切 db-type 的话，wall 用 SQLite 规则拦 PG schema 的 BIGSERIAL/行内注释，
    # 导致 xianyu_account 建不出来，后续所有 FK 引它的表全炸。
    # 同时 db-type=postgres 触发 PostgresProvider 的 @ConditionalOnProperty，让 DatabaseInitializer 拿到方言 bean。
    wall:
      db-type: postgres
      enabled: true
      config:
        drop-table-allow: false
        truncate-allow: false
        delete-where-none-check: true
        update-where-none-check: true
        multi-statement-allow: true
    druid:
      filters: stat,slf4j
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        slf4j:
          enabled: true
          statement-after-call-enabled: false
          result-set-log-enabled: false
