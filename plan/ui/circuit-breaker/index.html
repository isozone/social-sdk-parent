<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>熔断器 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}:root{--brand:#4f46e5;--cyan:#22d3ee;--bg-page:#f5f5f7;--text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--border:#e5e7eb;--radius-md:16px;--gradient-brand:linear-gradient(135deg,#4f46e5,#7c3aed)}.phone{width:393px;height:852px;border-radius:54px;background:var(--bg-page);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--text-primary)}.page-content{position:absolute;top:58px;left:0;right:0;bottom:84px;overflow-y:auto;-webkit-overflow-scrolling:touch}.page-content::-webkit-scrollbar{display:none}.nav{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.h-title{font-size:17px;font-weight:700;color:var(--text-primary);flex:1;text-align:center}.badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700}.badge-closed{background:rgba(239,68,68,.1);color:var(--danger)}.badge-open{background:rgba(16,185,129,.1);color:var(--success)}.badge-half{background:rgba(245,158,11,.1);color:var(--warning)}.card{background:#fff;border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);margin:0 16px 12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}.service-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border-light)}.service-row:last-child{border-bottom:none}.service-name{font-size:14px;font-weight:600;color:var(--text-primary)}.service-account{font-size:11px;color:var(--text-tertiary);margin-top:2px}.circuit-card{background:#fff;border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);margin:0 16px 12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}.circuit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.circuit-name{font-size:15px;font-weight:700;color:var(--text-primary)}.circuit-status{display:flex;align-items:center;gap:6px}.circuit-dot{width:8px;height:8px;border-radius:50%}.circuit-dot.closed{background:var(--danger)}.circuit-dot.open{background:var(--success)}.circuit-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.circuit-metric{background:var(--bg-page);border-radius:10px;padding:10px;text-align:center}.circuit-metric-value{font-size:16px;font-weight:800;color:var(--text-primary)}.circuit-metric-label{font-size:9px;color:var(--text-tertiary);margin-top:2px}.circuit-progress{height:8px;background:var(--bg-page);border-radius:4px;overflow:hidden;margin-bottom:10px}.circuit-progress-fill{height:100%;border-radius:4px;transition:width .3s}.circuit-footer{display:flex;gap:8px}.circuit-btn{flex:1;height:36px;border-radius:10px;font-size:12px;font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}.btn-danger{background:rgba(239,68,68,.1);color:var(--danger)}.btn-primary{background:var(--gradient-brand);color:#fff}.btn-gray{background:var(--bg-page);color:var(--text-secondary)}.global-bar{margin:0 16px 12px;display:flex;gap:8px}.global-btn{flex:1;height:42px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.global-btn.danger{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="page-content">
    <div class="nav"><span class="h-title">熔断器</span><span style="font-size:13px;color:var(--brand);font-weight:600">全局重置</span></div>
    <!-- Global Actions -->
    <div class="global-bar">
      <button class="global-btn danger">🔄 全部重置</button>
      <button class="global-btn">📊 健康检查</button>
    </div>
    <!-- Circuit Breakers -->
    <div class="section-head"><div class="section-title">服务熔断状态</div><span style="font-size:11px;color:var(--text-tertiary)">MTOP API · 实时</span></div>
    <div style="padding:0 16px 20px;display:flex;flex-direction:column;gap:12px">
      <div class="circuit-card">
        <div class="circuit-header"><div><div class="circuit-name">goods.query</div><div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">主力号 · 商品查询</div></div><div class="circuit-status"><div class="circuit-dot open"></div><span class="badge badge-open">闭合</span></div></div>
        <div class="circuit-metrics"><div class="circuit-metric"><div class="circuit-metric-value">99.2%</div><div class="circuit-metric-label">成功率</div></div><div class="circuit-metric"><div class="circuit-metric-value">128ms</div><div class="circuit-metric-label">平均延迟</div></div><div class="circuit-metric"><div class="circuit-metric-value" style="color:var(--success)">0</div><div class="circuit-metric-label">连续失败</div></div></div>
        <div class="circuit-progress"><div class="circuit-progress-fill" style="width:25%;background:var(--success)"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-tertiary)"><span>熔断阈值：错误率 > 80% 触发</span><span>错误率 25%</span></div>
      </div>
      <div class="circuit-card">
        <div class="circuit-header"><div><div class="circuit-name">message.sync</div><div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">副业号 · 消息同步</div></div><div class="circuit-status"><div class="circuit-dot closed"></div><span class="badge badge-closed">熔断中</span></div></div>
        <div class="circuit-metrics"><div class="circuit-metric"><div class="circuit-metric-value" style="color:var(--danger)">42.1%</div><div class="circuit-metric-label">成功率</div></div><div class="circuit-metric"><div class="circuit-metric-value" style="color:var(--danger)">2.8s</div><div class="circuit-metric-label">平均延迟</div></div><div class="circuit-metric"><div class="circuit-metric-value" style="color:var(--danger)">12</div><div class="circuit-metric-label">连续失败</div></div></div>
        <div class="circuit-progress"><div class="circuit-progress-fill" style="width:82%;background:var(--danger)"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-tertiary);margin-bottom:12px"><span>熔断阈值：错误率 > 80% 触发</span><span>错误率 82%</span></div>
        <div class="circuit-footer"><button class="circuit-btn btn-danger">⏸ 已熔断</button><button class="circuit-btn btn-primary">🔄 手动重置</button></div>
      </div>
      <div class="circuit-card">
        <div class="circuit-header"><div><div class="circuit-name">order.create</div><div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">主力号 · 订单创建</div></div><div class="circuit-status"><div class="circuit-dot open"></div><span class="badge badge-open">闭合</span></div></div>
        <div class="circuit-metrics"><div class="circuit-metric"><div class="circuit-metric-value">97.5%</div><div class="circuit-metric-label">成功率</div></div><div class="circuit-metric"><div class="circuit-metric-value">340ms</div><div class="circuit-metric-label">平均延迟</div></div><div class="circuit-metric"><div class="circuit-metric-value" style="color:var(--success)">0</div><div class="circuit-metric-label">连续失败</div></div></div>
        <div class="circuit-progress"><div class="circuit-progress-fill" style="width:15%;background:var(--success)"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-tertiary)"><span>熔断阈值：错误率 > 80% 触发</span><span>错误率 15%</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
