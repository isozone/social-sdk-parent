<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>收藏关注 - AI 鱼多宝</title>
<style>
@import url('../_design-system.css');
body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.collect-tabs{display:flex;gap:4px;padding:12px 16px}
.collect-tab{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--bg-card);border:1px solid transparent;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.collect-tab:active{transform:scale(.95)}
.collect-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 20px}
.collect-card{background:var(--bg-card);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:transform .2s cubic-bezier(.16,1,.3,1);cursor:pointer}
.collect-card:active{transform:scale(.96)}
.cc-img{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#f3f4f6,#e5e7eb);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.cc-fav{position:absolute;top:8px;right:8px;font-size:16px;color:var(--danger);filter:drop-shadow(0 1px 3px rgba(0,0,0,.2))}
.cc-body{padding:12px}
.cc-title{font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-price{font-size:16px;font-weight:800;color:var(--danger)}
.cc-meta{font-size:11px;color:var(--text-tertiary);margin-top:4px;display:flex;justify-content:space-between}
.empty-state{text-align:center;padding:80px 40px;color:var(--text-tertiary)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.5}
.empty-text{font-size:14px;line-height:1.6}
.sync-tip{margin:0 16px 12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.sync-tip-icon{font-size:22px}.sync-tip-text{font-size:12px;color:var(--text-secondary);flex:1}
.sync-tip-btn{padding:6px 14px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:transform .15s}
.sync-tip-btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="page-content">
    <div class="nav-bar" style="position:static;border-radius:0;background:var(--bg-card);border-bottom:1px solid var(--border-light);z-index:50">
      <button class="nav-back"><svg width="10" height="18" viewBox="0 0 10 18" fill="none"><path d="M8 1L2 9L8 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 返回</button>
      <span class="nav-title">收藏关注</span>
      <button style="background:var(--bg-page);color:var(--brand);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer" class="nav-icon-btn">🔄 同步</button>
    </div>
    <div class="collect-tabs">
      <div class="collect-tab active">商品 (28)</div>
      <div class="collect-tab">用户 (15)</div>
      <div class="collect-tab">店铺 (6)</div>
    </div>
    <div class="item-grid">
      <div class="collect-card">
        <div class="cc-img">👟<div class="cc-fav">♥</div></div>
        <div class="cc-body">
          <div class="cc-title">Adidas Yeezy Boost 350 V2 Zebra</div>
          <div class="cc-price">1,299</div>
          <div class="cc-meta"><span>卖家：潮流数码城</span><span>昨天收藏</span></div>
        </div>
      </div>
      <div class="collect-card">
        <div class="cc-img">🎧<div class="cc-fav">♥</div></div>
        <div class="cc-body">
          <div class="cc-title">AirPods Pro 2 代 USB-C 充电版</div>
          <div class="cc-price">899</div>
          <div class="cc-meta"><span>低于市场 ¥200</span><span>3 天前</span></div>
        </div>
      </div>
      <div class="collect-card">
        <div class="cc-img">⌚<div class="cc-fav">♥</div></div>
        <div class="cc-body">
          <div class="cc-title">Apple Watch Ultra 2 GPS+Cellular</div>
          <div class="cc-price">4,599</div>
          <div class="cc-meta"><span>卖家：二手好物铺</span><span>本周</span></div>
        </div>
      </div>
      <div class="collect-card">
        <div class="cc-img">📱<div class="cc-fav">♥</div></div>
        <div class="cc-body">
          <div class="cc-title">iPhone 15 Pro Max 256GB 原色钛金属</div>
          <div class="cc-price">6,800</div>
          <div class="cc-meta"><span>卖家：苹果之家</span><span>上周</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar safe-bottom">
    <div class="tab-item"><span class="tab-icon">📊</span><span class="tab-label">首页</span></div>
    <div class="tab-item"><span class="tab-icon">💬</span><span class="tab-label">消息</span></div>
    <div class="tab-item"><span class="tab-icon">🛒</span><span class="tab-label">商品</span></div>
    <div class="tab-item active"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>
</body>
</html>
