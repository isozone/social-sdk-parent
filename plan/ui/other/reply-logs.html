<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>自动回复日志 - AI 鱼多宝</title>
<style>
@import url('../_design-system.css');
body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.reply-log-header{background:var(--gradient-brand);padding:18px 16px 18px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:10px}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px;margin-top:-18px;position:relative;z-index:2}
.filter-bar{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.f-chip{flex:0 0 auto;white-space:nowrap;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:500;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all .2s}
.f-chip:active{transform:scale(.95)}
.f-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.log-list{padding:0 16px 20px;display:flex;flex-direction:column;gap:10px}
.log-card{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:14px 16px;transition:transform .2s cubic-bezier(.16,1,.3,1)}
.log-card:active{transform:scale(.98)}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.log-account{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-primary)}
.log-avatar{width:24px;height:24px;border-radius:8px;background:var(--gradient-brand);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.log-type{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600}
.lt-keyword{background:rgba(124,58,237,.1);color:var(--violet)}.lt-ai{background:rgba(34,211,238,.1);color:#0891b2}.lt-auto{background:rgba(16,185,129,.1);color:var(--success)}
.log-time{font-size:11px;color:var(--text-tertiary)}
.log-body{display:flex;flex-direction:column;gap:6px}
.log-line{display:flex;align-items:start;gap:8px;font-size:13px;line-height:1.5}
.log-lbl{font-size:11px;font-weight:700;color:var(--text-tertiary);min-width:32px;flex-shrink:0;margin-top:1px}
.log-match{color:var(--brand);font-weight:500}
.log-reply{color:var(--text-secondary)}
.log-unmatched{color:var(--text-tertiary)}
.log-status{margin-top:8px;display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--border-light)}
.log-dot{width:6px;height:6px;border-radius:50%}
.log-dot-success{background:var(--success)}.log-dot-muted{background:var(--text-tertiary)}
.log-msg{font-size:11px;font-weight:500}
.log-msg-success{color:var(--success)}.log-msg-muted{color:var(--text-tertiary)}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="page-content">
    <div class="nav-bar" style="position:static;border-radius:0;background:var(--bg-card);border-bottom:1px solid var(--border-light);z-index:50">
      <button class="nav-back"><svg width="10" height="18" viewBox="0 0 10 18" fill="none"><path d="M8 1L2 9L8 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> 返回</button>
      <span class="nav-title">自动回复日志</span>
      <div class="nav-actions"><button class="nav-icon-btn">📤</button></div>
    </div>
    <div class="summary-row">
      <div class="stat-card"><div class="stat-value">328</div><div class="stat-label">今日记录</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--success)">89%</div><div class="stat-label">匹配率</div></div>
      <div class="stat-card"><div class="stat-value">12</div><div class="stat-label">命中规则数</div></div>
    </div>
    <div class="filter-bar">
      <div class="f-chip active">全部 (328)</div>
      <div class="f-chip">主力号</div>
      <div class="f-chip">副业号</div>
      <div class="f-chip">关键词</div>
      <div class="f-chip">AI</div>
    </div>
    <div class="section-header" style="padding-left:0;padding-right:0">
      <div class="section-title">最近日志</div>
      <span class="chip chip-green">今日</span>
    </div>
    <div class="log-list">
      <div class="log-card">
        <div class="log-header">
          <div class="log-account"><div class="log-avatar">主</div>主力号</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="log-type lt-keyword">关键词</span>
            <span class="log-time">10:32:15</span>
          </div>
        </div>
        <div class="log-body">
          <div class="log-line"><span class="log-lbl">用户:</span><span>能便宜点吗 最低多少</span></div>
          <div class="log-line"><span class="log-lbl">匹配:</span><span class="log-match">价格议价 → "能便宜吗"</span></div>
          <div class="log-line"><span class="log-lbl">回复:</span><span class="log-reply">可以的亲，给您个小折扣～</span></div>
        </div>
        <div class="log-status">
          <span class="log-dot log-dot-success"></span>
          <span class="log-msg log-msg-success">自动发送成功</span>
        </div>
      </div>
      <div class="log-card">
        <div class="log-header">
          <div class="log-account"><div class="log-avatar" style="background:var(--gradient-cold)">副</div>副业号</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="log-type lt-auto">自动</span>
            <span class="log-time">10:15:42</span>
          </div>
        </div>
        <div class="log-body">
          <div class="log-line"><span class="log-lbl">用户:</span><span>你好 这个还在吗</span></div>
          <div class="log-line"><span class="log-lbl">匹配:</span><span class="log-match">通用问候 → "你好"</span></div>
          <div class="log-line"><span class="log-lbl">回复:</span><span class="log-reply">在的亲，有什么可以帮您的？</span></div>
        </div>
        <div class="log-status">
          <span class="log-dot log-dot-success"></span>
          <span class="log-msg log-msg-success">自动发送成功</span>
        </div>
      </div>
      <div class="log-card" style="opacity:.8">
        <div class="log-header">
          <div class="log-account"><div class="log-avatar">主</div>主力号</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="log-type lt-ai">AI</span>
            <span class="log-time">09:58:03</span>
          </div>
        </div>
        <div class="log-body">
          <div class="log-line"><span class="log-lbl">用户:</span><span>发货方式有哪些</span></div>
          <div class="log-line"><span class="log-lbl">匹配:</span><span class="log-unmatched">未匹配到规则</span></div>
        </div>
        <div class="log-status">
          <span class="log-dot log-dot-muted"></span>
          <span class="log-msg log-msg-muted">未自动回复</span>
        </div>
      </div>
    </div>
  </div>
  <div class="tab-bar safe-bottom">
    <div class="tab-item"><span class="tab-icon">📊</span><span class="tab-label">首页</span></div>
    <div class="tab-item"><span class="tab-icon">💬</span><span class="tab-label">消息</span></div>
    <div class="tab-item"><span class="tab-icon">🛒</span><span class="tab-label">商品</span></div>
    <div class="tab-item active"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>
</body>
</html>
