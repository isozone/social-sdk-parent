<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>订单详情 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Inter',system-ui,sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone-frame{width:393px;height:852px;border-radius:54px;background:#f5f5f7;position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:13px;font-weight:600;color:#111827}
.page-content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.page-content::-webkit-scrollbar{display:none}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Nav */
.nav-bar{position:absolute;top:58px;left:0;right:0;height:44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #f3f4f6;z-index:50}
.back-btn{display:flex;align-items:center;gap:4px;font-size:15px;color:#4f46e5;cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600}
.nav-title{font-size:17px;font-weight:700;color:#111827}

/* Status Header */
.order-status-header{padding:20px 16px 24px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.order-status-header::before{content:'';position:absolute;top:-40%;right:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%);border-radius:50%}
.status-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.status-label{font-size:12px;color:rgba(255,255,255,.7);font-weight:500}
.status-value{font-size:20px;font-weight:800;color:#fff;margin-top:4px}
.status-chip{padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* Product Card */
.product-section{margin:-18px 16px 0;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);position:relative;z-index:2;display:flex;gap:12px;align-items:center}
.product-img{width:72px;height:72px;border-radius:14px;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.product-info{flex:1;min-width:0}
.product-name{font-size:14px;font-weight:600;color:#111827;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-meta{font-size:11px;color:#9ca3af;margin-top:4px}
.product-price{font-size:18px;font-weight:800;color:#ef4444}

/* Info Grid */
.info-grid{margin:16px;display:flex;flex-direction:column;gap:12px}
.info-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.03);overflow:hidden}
.info-section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f3f4f6}
.info-section-title{font-size:14px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px}
.info-section-sub{font-size:11px;color:#9ca3af}
.info-rows{padding:12px 16px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.info-row:not(:last-child){border-bottom:1px solid #f8f8f9}
.info-label{font-size:12px;color:#9ca3af;flex-shrink:0}
.info-value{font-size:12px;color:#111827;font-weight:500;text-align:right}
.buyer-info{display:flex;align-items:center;gap:10px;padding:12px 16px}
.buyer-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.buyer-name{font-size:14px;font-weight:600;color:#111827}
.buyer-id{font-size:11px;color:#9ca3af;margin-top:1px}

/* Timeline */
.timeline{padding:12px 16px}
.timeline-item{display:flex;gap:12px;position:relative;padding-bottom:16px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:#4f46e5;flex-shrink:0;margin-top:4px;position:relative}
.timeline-dot::after{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:2px;height:calc(100% - 10px);background:#e5e7eb}
.timeline-item:last-child .timeline-dot::after{display:none}
.timeline-content{flex:1;min-width:0}
.timeline-text{font-size:12px;color:#111827;font-weight:500}
.timeline-time{font-size:10px;color:#9ca3af;margin-top:2px}

/* Action Bar */
.action-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #e5e7eb;padding:12px 16px;z-index:80}
.action-row{display:flex;gap:10px}
.action-btn{flex:1;height:48px;border-radius:16px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;justify-content:center;gap:6px}
.action-btn:active{transform:scale(.97)}
.action-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 8px 24px rgba(79,70,229,.3)}
.action-secondary{background:#f5f5f7;color:#6b7280;border:1px solid #e5e7eb}
.action-danger{background:#fff;color:#ef4444;border:1px solid #fecaca}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <!-- Nav -->
  <div class="nav-bar">
    <button class="back-btn" onclick="location.href='list.html'">← 返回</button>
    <span class="nav-title">订单详情</span>
    <span></span>
  </div>

  <div class="page-content">
    <!-- Status Header -->
    <div class="order-status-header">
      <div class="status-row">
        <div>
          <div class="status-label">当前状态</div>
          <div class="status-value">待发货</div>
        </div>
        <span class="status-chip">订单号 ORD-2026072501</span>
      </div>
    </div>

    <!-- Product -->
    <div class="product-section">
      <div class="product-img">🎧</div>
      <div class="product-info">
        <div class="product-name">索尼WH-1000XM5 降噪耳机 黑色 头戴式</div>
        <div class="product-meta">规格：黑色 · 卖家：主力号</div>
      </div>
      <div class="product-price">¥1899</div>
    </div>

    <!-- Buyer Info -->
    <div class="info-grid">
      <div class="info-card">
        <div class="info-section-head">
          <div class="info-section-title">👤 买家信息</div>
        </div>
        <div class="buyer-info">
          <div class="buyer-avatar">张</div>
          <div>
            <div class="buyer-name">张三</div>
            <div class="buyer-id">ID: xy_user_***892</div>
          </div>
        </div>
      </div>

      <div class="info-card">
        <div class="info-section-head">
          <div class="info-section-title">📦 订单信息</div>

        </div>
        <div class="info-rows">
          <div class="info-row"><span class="info-label">支付金额</span><span class="info-value" style="color:#ef4444;font-weight:700;font-size:15px">¥1,899.00</span></div>
          <div class="info-row"><span class="info-label">运费</span><span class="info-value">包邮</span></div>
          <div class="info-row"><span class="info-label">收货地址</span><span class="info-value">广东省深圳市南山区****</span></div>
          <div class="info-row"><span class="info-label">备注</span><span class="info-value">请尽快发货，谢谢</span></div>
        </div>
      </div>

      <div class="info-card">
        <div class="info-section-head">
          <div class="info-section-title">📋 物流状态</div>
        </div>
        <div class="timeline">
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <div class="timeline-text">已下单，等待发货</div>
              <div class="timeline-time">2026-07-25 11:18</div>
            </div>
          </div>
          <div class="timeline-item">
            <div class="timeline-dot" style="background:#e5e7eb"></div>
            <div class="timeline-content">
              <div class="timeline-text" style="color:#9ca3af">买家已付款</div>
              <div class="timeline-time">2026-07-25 11:20</div>
            </div>
          </div>
          <div class="timeline-item">
            <div class="timeline-dot" style="background:#e5e7eb"></div>
            <div class="timeline-content">
              <div class="timeline-text" style="color:#9ca3af">等待卖家发货</div>
              <div class="timeline-time">等待中</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <div class="action-row">
      <button class="action-btn action-danger">取消订单</button>
      <button class="action-btn action-primary">📦 确认发货</button>
    </div>
  </div>
</div>
</body>
</html>
