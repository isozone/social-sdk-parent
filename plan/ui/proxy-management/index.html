<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>代理管理 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}:root{--brand:#4f46e5;--cyan:#22d3ee;--bg-page:#f5f5f7;--text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--border:#e5e7eb;--radius-md:16px;--gradient-brand:linear-gradient(135deg,#4f46e5,#7c3aed)}.phone{width:393px;height:852px;border-radius:54px;background:var(--bg-page);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--text-primary)}.page-content{position:absolute;top:58px;left:0;right:0;bottom:84px;overflow-y:auto;-webkit-overflow-scrolling:touch}.page-content::-webkit-scrollbar{display:none}.nav{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.h-title{font-size:17px;font-weight:700;color:var(--text-primary);flex:1;text-align:center}.header-actions{display:flex;gap:8px}.action-btn{height:32px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;gap:4px}.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text-secondary)}.btn-primary{background:var(--gradient-brand);color:#fff}.card{background:#fff;border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);margin:0 16px 12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}.provider-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-light)}.provider-row:last-child{border-bottom:none}.provider-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.provider-info{flex:1}.provider-name{font-size:14px;font-weight:600;color:var(--text-primary)}.provider-type{font-size:11px;color:var(--text-tertiary);margin-top:2px}.proxy-list{display:flex;flex-direction:column;gap:10px;padding:0 16px 20px}.proxy-item{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}.proxy-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.proxy-address{font-size:13px;font-weight:600;color:var(--text-primary);font-family:'JetBrains Mono',monospace}.proxy-status{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}.status-dot{width:7px;height:7px;border-radius:50%}.status-dot.ok{background:var(--success)}.status-dot.warn{background:var(--warning)}.status-dot.err{background:var(--danger)}.proxy-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.proxy-stat{background:var(--bg-page);border-radius:8px;padding:8px;text-align:center}.proxy-stat-val{font-size:14px;font-weight:800;color:var(--text-primary)}.proxy-stat-label{font-size:9px;color:var(--text-tertiary);margin-top:1px}.health-bar{height:4px;background:var(--bg-page);border-radius:2px;margin-top:10px;overflow:hidden}.health-fill{height:100%;border-radius:2px}.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}.section-title{font-size:16px;font-weight:700;color:var(--text-primary)}
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="page-content">
    <div class="nav"><span class="h-title">代理管理</span><div class="header-actions"><button class="action-btn btn-outline">🔄 重载</button></div></div>
    <!-- Provider Overview -->
    <div class="section-head"><div class="section-title">供应商配置</div><span style="font-size:12px;color:var(--text-tertiary)">2 个已配置</span></div>
    <div class="card">
      <div class="provider-row"><div class="provider-icon" style="background:rgba(79,70,229,.08);color:var(--brand)">🌐</div><div class="provider-info"><div class="provider-name">ProxyPool A</div><div class="provider-type">住宅代理 · API Key 模式</div></div><div style="font-size:11px;font-weight:700;color:var(--success)">在线</div></div>
      <div class="provider-row" style="border:none"><div class="provider-icon" style="background:rgba(34,211,238,.1);color:#0891b2">☁️</div><div class="provider-info"><div class="provider-name">CloudProxy B</div><div class="provider-type">数据中心代理 · Token 认证</div></div><div style="font-size:11px;font-weight:700;color:var(--warning)">限流</div></div>
    </div>
    <!-- Proxy Pool -->
    <div class="section-head"><div class="section-title">代理池状态</div><span style="font-size:12px;color:var(--brand);font-weight:600">健康检查 ></span></div>
    <div class="proxy-list">
      <div class="proxy-item">
        <div class="proxy-header"><div class="proxy-address">103.25.*.***:8080</div><div class="proxy-status"><span class="status-dot ok"></span><span style="color:var(--success)">正常</span></div></div>
        <div class="proxy-meta"><div class="proxy-stat"><div class="proxy-stat-val">42ms</div><div class="proxy-stat-label">延迟</div></div><div class="proxy-stat"><div class="proxy-stat-val">98%</div><div class="proxy-stat-label">成功率</div></div><div class="proxy-stat"><div class="proxy-stat-val">3</div><div class="proxy-stat-label">绑定账号</div></div></div>
        <div class="health-bar"><div class="health-fill" style="width:98%;background:var(--success)"></div></div>
      </div>
      <div class="proxy-item">
        <div class="proxy-header"><div class="proxy-address">185.92.*.***:1080</div><div class="proxy-status"><span class="status-dot warn"></span><span style="color:var(--warning)">高延迟</span></div></div>
        <div class="proxy-meta"><div class="proxy-stat"><div class="proxy-stat-val" style="color:var(--warning)">380ms</div><div class="proxy-stat-label">延迟</div></div><div class="proxy-stat"><div class="proxy-stat-val">82%</div><div class="proxy-stat-label">成功率</div></div><div class="proxy-stat"><div class="proxy-stat-val">1</div><div class="proxy-stat-label">绑定账号</div></div></div>
        <div class="health-bar"><div class="health-fill" style="width:82%;background:var(--warning)"></div></div>
      </div>
      <div class="proxy-item">
        <div class="proxy-header"><div class="proxy-address">45.76.*.***:9090</div><div class="proxy-status"><span class="status-dot err"></span><span style="color:var(--danger)">不可用</span></div></div>
        <div class="proxy-meta"><div class="proxy-stat"><div class="proxy-stat-val" style="color:var(--danger)">—</div><div class="proxy-stat-label">延迟</div></div><div class="proxy-stat"><div class="proxy-stat-val" style="color:var(--danger)">12%</div><div class="proxy-stat-label">成功率</div></div><div class="proxy-stat"><div class="proxy-stat-val">0</div><div class="proxy-stat-label">绑定账号</div></div></div>
        <div class="health-bar"><div class="health-fill" style="width:12%;background:var(--danger)"></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
