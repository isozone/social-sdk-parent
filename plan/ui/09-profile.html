<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>个人中心 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:84px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #f0f0f0;display:flex;z-index:80;padding-bottom:8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab-icon{font-size:22px;color:#9ca3af;transition:color .2s}.tab-item.active .tab-icon{color:var(--brand)}
.tab-label{font-size:10px;color:#9ca3af;font-weight:500}.tab-item.active .tab-label{color:var(--brand);font-weight:600}
/* Hero */
.profile-hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);padding:24px 20px 36px;color:#fff;position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.profile-hero::before{content:'';position:absolute;top:-30%;right:-15%;width:220px;height:220px;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%);border-radius:50%}
.profile-hero::after{content:'';position:absolute;bottom:-25%;left:-10%;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%);border-radius:50%}
.profile-top{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:28px;backdrop-filter:blur(4px)}
.profile-info h2{font-size:20px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.15)}.profile-info p{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px}
.profile-badge{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);position:relative;z-index:1}
/* Wallet Card */
.wallet-card{background:#fff;border-radius:18px;margin:-28px 16px 0;padding:18px;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.06);position:relative;z-index:2}
.wallet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wallet-title{font-size:14px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:6px}
.wallet-sync{font-size:12px;color:var(--brand);font-weight:600;cursor:pointer}
.wallet-balance{display:flex;align-items:baseline;gap:2px}
.wallet-amount{font-size:32px;font-weight:800;color:var(--brand);line-height:1}.wallet-unit{font-size:14px;color:var(--text-3);margin-left:2px;font-weight:500}
.wallet-row{display:flex;gap:8px;margin-top:14px}
.wallet-item{flex:1;text-align:center;padding:10px 6px;background:#fafafa;border-radius:12px;border:1px solid #f0f0f0}
.wallet-item-val{font-size:16px;font-weight:700;color:var(--text-1)}.wallet-item-label{font-size:11px;color:var(--text-3);margin-top:3px}
/* Menu Sections */
.menu-section{padding:20px 16px 8px}
.menu-group{background:#fff;border-radius:18px;border:1px solid var(--border);overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:background .15s}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#fafafa}
.menu-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.icon-violet{background:linear-gradient(135deg,rgba(79,70,229,.12),rgba(124,58,237,.06))}
.icon-cyan{background:linear-gradient(135deg,rgba(6,182,212,.12),rgba(6,182,212,.06))}
.icon-green{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.06))}
.icon-amber{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.06))}
.icon-red{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(239,68,68,.06))}
.icon-slate{background:linear-gradient(135deg,rgba(100,116,139,.12),rgba(100,116,139,.06))}
.icon-purple{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(139,92,246,.06))}
.menu-text{flex:1;font-size:15px;color:var(--text-1);font-weight:500}
.menu-arrow{font-size:16px;color:var(--text-3)}
.menu-tag{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
.tag-blue{background:rgba(79,70,229,.1);color:var(--brand)}
.tag-red2{background:rgba(239,68,68,.1);color:var(--danger)}
.tag-amber2{background:rgba(245,158,11,.1);color:var(--warning)}
/* Logout */
.logout-btn{margin:16px;padding:14px;background:#fff;color:var(--danger);border:1px solid #fecaca;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.logout-btn:active{background:#fef2f2}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <div class="profile-hero">
      <div class="profile-top">
        <div class="profile-avatar">V</div>
        <div class="profile-info"><h2>Vim 老师</h2><p>vim@example.com · 138****8888</p></div>
      </div>
      <div class="profile-badge">⭐ 高级会员 · 有效期至 2026-12-31</div>
    </div>
    <!-- Wallet -->
    <div class="wallet-card">
      <div class="wallet-header"><div class="wallet-title">💰 钱包资产</div><div class="wallet-sync">同步余额</div></div>
      <div class="wallet-balance"><span class="wallet-amount">3,280.50</span><span class="wallet-unit">元</span></div>
      <div class="wallet-row">
        <div class="wallet-item"><div class="wallet-item-val">1,200.00</div><div class="wallet-item-label">可提现</div></div>
        <div class="wallet-item"><div class="wallet-item-val">1,880.50</div><div class="wallet-item-label">已冻结</div></div>
        <div class="wallet-item"><div class="wallet-item-val">200.00</div><div class="wallet-item-label">本月收益</div></div>
      </div>
    </div>
    <!-- Menus -->
    <div class="menu-section">
      <div class="menu-group">
        <div class="menu-item"><div class="menu-icon icon-violet">🔑</div><div class="menu-text">修改密码</div><div class="menu-arrow">&#8250;</div></div>
        <div class="menu-item"><div class="menu-icon icon-cyan">👥</div><div class="menu-text">账号管理</div><div class="menu-arrow">&#8250;</div></div>
        <div class="menu-item"><div class="menu-icon icon-green">📐</div><div class="menu-text">规则管理</div><div class="menu-arrow">&#8250;</div></div>
        <div class="menu-item"><div class="menu-icon icon-slate">📋</div><div class="menu-text">自动回复日志</div><div class="menu-tag tag-blue">查看</div></div>
      </div>
      <div class="menu-group">
        <div class="menu-item"><div class="menu-icon icon-amber">💳</div><div class="menu-text">交易记录</div><div class="menu-arrow">&#8250;</div></div>
        <div class="menu-item"><div class="menu-icon icon-red">✉</div><div class="menu-text">评价与退款</div><div class="menu-tag tag-red2">2 条</div></div>
        <div class="menu-item"><div class="menu-icon icon-purple">🤖</div><div class="menu-text">AI 功能中心</div><div class="menu-tag tag-amber2">新功能</div></div>
        <div class="menu-item"><div class="menu-icon icon-slate">⚙</div><div class="menu-text">设置</div><div class="menu-arrow">&#8250;</div></div>
        <div class="menu-item"><div class="menu-icon icon-slate">ℹ</div><div class="menu-text">关于我们</div><div class="menu-arrow">&#8250;</div></div>
      </div>
    </div>
    <button class="logout-btn">退出登录</button>
  </div>
  <div class="tabbar">
    <div class="tab-item"><div class="tab-icon">📊</div><div class="tab-label">首页</div></div>
    <div class="tab-item"><div class="tab-icon">💬</div><div class="tab-label">消息</div></div>
    <div class="tab-item"><div class="tab-icon">🛒</div><div class="tab-label">商品</div></div>
    <div class="tab-item active"><div class="tab-icon">👤</div><div class="tab-label">我的</div></div>
  </div>
</div>
</body>
</html>
