<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>聊天窗口 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
/* Chat Header */
.chat-head{padding:10px 16px 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:relative;z-index:20}
.back{font-size:22px;color:var(--text-2);cursor:pointer;padding:4px}
.chat-info{flex:1;text-align:center;margin-right:28px}
.chat-name{font-size:16px;font-weight:600;color:var(--text-1)}
.chat-sub{font-size:11px;color:var(--text-3);margin-top:1px;display:flex;align-items:center;justify-content:center;gap:4px}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.quick-menu{font-size:20px;color:var(--text-2);cursor:pointer}
/* Message Area */
.msg-area{padding:12px 14px 8px;min-height:calc(100% - 180px);display:flex;flex-direction:column}
.msg-time{text-align:center;font-size:11px;color:var(--text-3);margin:12px 0;padding:3px 10px;background:rgba(156,163,175,.08);border-radius:10px;align-self:center}
.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
.msg-row.me{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.msg-bubble{max-width:68%;padding:11px 14px;font-size:14px;line-height:1.55;color:var(--text-1);border-radius:18px}
.msg-row.other .msg-bubble{background:#fff;border:1px solid #f0f0f0;border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.msg-row.me .msg-bubble{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-bottom-right-radius:6px;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.msg-image{border-radius:14px;overflow:hidden}
.msg-image img{width:100%;display:block}
.ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:rgba(79,70,229,.1);color:var(--brand);padding:3px 8px;border-radius:8px;margin-top:5px;font-weight:600}
.ai-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--brand-2)}
/* Quick Replies */
.quick-replies{background:#fff;border-top:1px solid var(--border);padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;display:flex;gap:8px}
.quick-replies::-webkit-scrollbar{display:none}
.qr-btn{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(79,70,229,.06);color:var(--brand);border:1px solid rgba(79,70,229,.12);cursor:pointer;transition:all .2s}
.qr-btn:active{background:rgba(79,70,229,.12);transform:scale(.96)}
/* Input Bar */
.input-bar{background:#fff;border-top:1px solid var(--border);padding:10px 16px 22px;display:flex;align-items:center;gap:10px}
.input-box{flex:1;height:42px;border:1px solid #e8e8e8;border-radius:21px;padding:0 16px;font-size:14px;color:var(--text-1);outline:none;transition:border-color .2s}
.input-box:focus{border-color:var(--brand)}
.input-actions{display:flex;gap:6px}
.action-icon-btn{width:42px;height:42px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:background .2s}
.action-icon-btn:active{background:#e5e7eb}
.send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));border:none;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,.3);transition:transform .15s;display:flex;align-items:center;justify-content:center}
.send-btn:active{transform:scale(.92)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <div class="chat-head">
      <div class="back">&#8592;</div>
      <div class="chat-info">
        <div class="chat-name">张小明</div>
        <div class="chat-sub"><span class="online-dot"></span>在线 · 闲鱼用户</div>
      </div>
      <div class="quick-menu">&#8942;</div>
    </div>
    <div class="msg-area">
      <div class="msg-time">今天 10:20</div>
      <div class="msg-row other">
        <div class="msg-avatar" style="background:linear-gradient(135deg,#06b6d4,#22d3ee)">张</div>
        <div class="msg-bubble">你好，这个商品还有吗？<br>价格是实价的吗？</div>
      </div>
      <div class="msg-row me">
        <div class="msg-avatar" style="background:linear-gradient(135deg,var(--brand),var(--brand-2))">我</div>
        <div class="msg-bubble">有的亲，价格就是标价哦～<br>当天发货，包邮的。</div>
      </div>
      <div class="msg-row other">
        <div class="msg-avatar" style="background:linear-gradient(135deg,#06b6d4,#22d3ee)">张</div>
        <div class="msg-bubble">好的，那我要一个<br>大概什么时候到呢</div>
      </div>
      <div class="msg-row me">
        <div class="msg-avatar" style="background:linear-gradient(135deg,var(--brand),var(--brand-2))">我</div>
        <div class="msg-bubble">今天下单的话明天就到了<br>偏远地区可能慢一天</div>
      </div>
      <div class="msg-row me">
        <div class="msg-avatar" style="background:linear-gradient(135deg,var(--brand),var(--brand-2))">我</div>
        <div class="msg-bubble">这个是AI自动回复 <div class="ai-tag">AI 已开启 · 关键词匹配</div></div>
      </div>
    </div>
    <div class="quick-replies">
      <div class="qr-btn">在的亲</div>
      <div class="qr-btn">包邮</div>
      <div class="qr-btn">今天发货</div>
      <div class="qr-btn">稍等一下</div>
      <div class="qr-btn">可以小刀</div>
    </div>
    <div class="input-bar">
      <div class="action-icon-btn">&#128247;</div>
      <input class="input-box" placeholder="输入消息...">
      <div class="action-icon-btn">&#127911;</div>
      <div class="send-btn">➤</div>
    </div>
  </div>
</div>
</body>
</html>
