<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>发布商品 - AI 鱼多宝</title>
<style>
@import url('_design-system.css');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}

.form-header{background:var(--gradient-brand);padding:48px 16px 28px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:12px}
.form-back{color:#fff;font-size:22px;cursor:pointer}
.form-title{color:#fff;font-size:17px;font-weight:700}

.form-body{padding:0 16px 20px}

.section-card{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border-light);box-shadow:var(--shadow-sm);overflow:hidden}

.section-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-icon{width:28px;height:28px;border-radius:8px;background:rgba(79,70,229,.08);display:flex;align-items:center;justify-content:center;font-size:14px}
.section-name{font-size:15px;font-weight:700;color:var(--text-primary)}
.section-sub{font-size:12px;color:var(--text-tertiary);font-weight:400}

/* Upload grid */
.upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.upload-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;position:relative}
.upload-item--gray{background:linear-gradient(135deg,#f3f4f6,#e5e7eb)}
.upload-item--blue{background:linear-gradient(135deg,#e0e7ff,#c7d2fe)}
.upload-item--green{background:linear-gradient(135deg,#e0f2fe,#e8f5e9)}
.upload-placeholder{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:32px;border-radius:inherit}
.upload-add{border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-tertiary);font-size:11px;background:var(--bg-page);transition:all .2s}
.upload-add:active{border-color:var(--brand);color:var(--brand)}
.upload-add .plus{font-size:28px;line-height:1}

/* Fields */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:7px;display:block}
.field-input{width:100%;height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;font-size:14px;color:var(--text-primary);outline:none;transition:all .25s}
.field-input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
textarea.field-input{height:120px;padding-top:12px;resize:none;line-height:1.6}
.char-count{font-size:11px;color:var(--text-tertiary);text-align:right;margin-top:4px}

/* Category picker */
.category-picker{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-page);border-radius:var(--radius-sm);border:1px solid var(--border)}
.category-main{font-size:14px;color:var(--text-primary);font-weight:500}
.category-sub{font-size:12px;color:var(--text-tertiary);margin-top:2px}

/* Price row */
.price-row{display:flex;gap:10px}
.price-input-wrap{flex:1;position:relative}
.price-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:700;color:var(--danger);pointer-events:none}
.price-input{padding-left:32px}
.stock-input{width:100px}

/* Account selector */
.account-select{display:flex;gap:8px}
.acc-opt{flex:1;padding:10px;background:var(--bg-page);border-radius:var(--radius-sm);text-align:center;font-size:12px;font-weight:500;color:var(--text-secondary);border:2px solid transparent;cursor:pointer;transition:all .2s}
.acc-opt:active{transform:scale(.97)}
.acc-opt.active{border-color:var(--brand);background:rgba(79,70,229,.06);color:var(--brand);font-weight:700}

/* Condition tabs */
.condition-tabs{display:flex;gap:8px}
.condition-tab{flex:1;padding:8px;text-align:center;border-radius:var(--radius-xs);font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--bg-page);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.condition-tab:active{transform:scale(.97)}
.condition-tab.active{border-color:var(--brand);background:rgba(79,70,229,.06);color:var(--brand);font-weight:700}

/* Submit bar */
.submit-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border-light);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:80}
.submit-row{display:flex;gap:10px}
.submit-btn{flex:1;height:50px;border-radius:var(--radius-sm);font-size:16px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.submit-btn:active{transform:scale(.97)}
.submit-btn--brand{background:var(--gradient-brand);color:#fff;box-shadow:0 8px 32px rgba(79,70,229,.35)}
.submit-btn--ghost{background:var(--bg-page);color:var(--text-secondary);font-size:14px}
.save-tip{text-align:center;font-size:11px;color:var(--text-tertiary);margin-top:8px}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span>●●●●●</span></div>

  <div class="page-content" style="bottom:0">
    <!-- Form Header -->
    <div class="form-header">
      <span class="form-back">‹ 返回</span>
      <span class="form-title">发布商品</span>
    </div>

    <div class="form-body">
      <!-- Account Section -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-icon">👤</div>
          <div class="section-name">发布账号</div>
        </div>
        <div class="account-select">
          <div class="acc-opt active">主力号</div>
          <div class="acc-opt">副业号</div>
          <div class="acc-opt">本地商品</div>
        </div>
      </div>

      <!-- Images -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-icon">📷</div>
          <div class="section-name">商品图片 <span class="section-sub">（最多9张）</span></div>
        </div>
        <div class="upload-grid">
          <div class="upload-item">
            <div class="upload-placeholder upload-item--gray">👟</div>
          </div>
          <div class="upload-item">
            <div class="upload-placeholder upload-item--blue">👟</div>
          </div>
          <div class="upload-item">
            <div class="upload-placeholder upload-item--green">📦</div>
          </div>
          <div class="upload-add"><span class="plus">+</span><span>添加图片</span></div>
        </div>
      </div>

      <!-- Info -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-icon">📝</div>
          <div class="section-name">商品信息</div>
        </div>
        <div class="field">
          <label class="field-label">商品标题</label>
          <input class="field-input" placeholder="请输入商品标题（≤30字）">
          <div class="char-count">0 / 30</div>
        </div>
        <div class="field">
          <label class="field-label">商品描述</label>
          <textarea class="field-input" placeholder="详细描述商品成色、使用情况、来源等..."></textarea>
          <div class="char-count">0 / 500</div>
        </div>
        <div class="field">
          <label class="field-label">分类</label>
          <div class="category-picker"><div><div class="category-main">运动鞋 > 板鞋</div><div class="category-sub">点击切换分类</div></div><span style="color:var(--text-tertiary)">›</span></div>
        </div>
        <div class="field">
          <label class="field-label">价格 & 库存</label>
          <div class="price-row">
            <div class="price-input-wrap"><span class="price-prefix">¥</span><input class="field-input price-input" placeholder="0.00"></div>
            <input class="field-input stock-input" placeholder="库存">
          </div>
        </div>
      </div>

      <!-- Publish Settings -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-icon">⚙️</div>
          <div class="section-name">发布设置</div>
        </div>
        <div class="field">
          <label class="field-label">发货方式</label>
          <select class="field-input"><option>邮寄 · 运费自理</option><option>包邮</option><option>同城自提</option></select>
        </div>
        <div class="field">
          <label class="field-label">宝贝成新</label>
          <div class="condition-tabs">
            <span class="condition-tab active">全新</span>
            <span class="condition-tab">近乎全新</span>
            <span class="condition-tab">轻微使用</span>
            <span class="condition-tab">明显使用</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Submit Bar -->
  <div class="submit-bar">
    <div class="submit-row">
      <button class="submit-btn submit-btn--ghost">存草稿</button>
      <button class="submit-btn submit-btn--brand">发布</button>
    </div>
    <div class="save-tip">发布后将在闲鱼展示，可立即开始自动回复</div>
  </div>
</div>
</body>
</html>
