<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chrome 配置 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--violet:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--t1:#111827;--t2:#6b7280;--t3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,'PingFang SC','SF Pro Display',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.st{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--t1)}
.ct{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.ct::-webkit-scrollbar{display:none}
.hd{background:#fff;padding:10px 16px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.bk{font-size:22px;color:var(--t2);cursor:pointer;padding:4px}
.pt{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--t1);margin-right:28px}
.hb{font-size:20px;color:var(--t2);cursor:pointer}
/* Detect section */
.detect-card{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);margin:14px 16px;padding:20px;border-radius:18px;color:#fff;position:relative;overflow:hidden;text-align:center}
.detect-card::before{content:'';position:absolute;top:-30%;right:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 70%);border-radius:50%}
.detect-card::after{content:'';position:absolute;bottom:-25%;left:-10%;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);border-radius:50%}
.detect-icon{font-size:48px;margin-bottom:12px;position:relative;z-index:1}
.detect-status{font-size:18px;font-weight:700;margin-bottom:6px;position:relative;z-index:1}
.detect-sub{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:16px;position:relative;z-index:1}
.detect-btn{height:44px;border-radius:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:15px;font-weight:600;cursor:pointer;position:relative;z-index:1;transition:all .2s}
.detect-btn:active{background:rgba(255,255,255,.3);transform:scale(.97)}
/* Config form */
.config-card{background:#fff;margin:0 16px 12px;border-radius:16px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.cfg-title{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.cfg-row{margin-bottom:12px}
.cfg-row:last-child{margin-bottom:0}
.cfg-label{font-size:12px;color:var(--t2);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.cfg-input{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--border);background:#f9fafb;padding:0 14px;font-size:14px;color:var(--t1);outline:none;transition:all .25s}
.cfg-input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.cfg-input:read-only{background:#f3f4f6;color:var(--t2)}
.cfg-select{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--border);background:#f9fafb;padding:0 14px;font-size:14px;color:var(--t1);outline:none;appearance:none;-webkit-appearance:none}
.cfg-actions{display:flex;gap:8px;margin-top:14px}
.cfg-btn{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:all .15s}
.cfg-btn:active{transform:scale(.97)}
.cfg-primary{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.25)}
.cfg-outline{background:#fff;color:var(--t2);border:1.5px solid var(--border)}
/* Download area */
.download-card{background:#fff;margin:0 16px 12px;border-radius:16px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.dl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dl-title{font-size:15px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:6px}
.dl-chip{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700}
.dlc-green{background:rgba(16,185,129,.1);color:var(--success)}.dlc-amber{background:rgba(245,158,11,.1);color:var(--warning)}
.dl-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#f9fafb;margin-bottom:8px;border:1px solid var(--border)}
.dl-item:last-child{margin-bottom:0}
.dl-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.di-blue{background:linear-gradient(135deg,#4285f4,#34a853)}.di-green{background:linear-gradient(135deg,#10b981,#22c55e)}
.dl-info{flex:1}.dl-name{font-size:14px;font-weight:600;color:var(--t1)}.dl-ver{font-size:12px;color:var(--t3);margin-top:2px}
.dl-btn{height:36px;border-radius:10px;padding:0 16px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.db-primary{background:var(--brand);color:#fff}.db-outline{background:#f3f4f6;color:var(--t2)}
/* Validation result */
.valid-card{background:#fff;margin:0 16px 12px;border-radius:16px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.vld-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.vld-title{font-size:15px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:6px}
.vld-check{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.vld-ok{background:rgba(16,185,129,.1)}.vld-warn{background:rgba(245,158,11,.1)}
.vld-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f8fafc}
.vld-item:last-child{border-bottom:none}
.vld-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.vd-ok{background:var(--success)}.vd-warn{background:var(--warning)}.vd-err{background:var(--danger)}
.vld-text{flex:1;font-size:13px;color:var(--t1)}
.vld-result{font-size:11px;font-weight:600}
.vr-ok{color:var(--success)}.vr-warn{color:var(--warning)}.vr-err{color:var(--danger)}
/* Full scan */
.scan-area{padding:0 16px 20px;display:flex;gap:8px}
.scan-btn{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:none;transition:all .15s}
.scan-btn:active{transform:scale(.97)}
.scan-primary{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.25)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
<div class="island"></div>
<div class="st"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
<div class="ct">
<div class="hd"><div class="bk">&#8592;</div><div class="pt">Chrome 配置</div><div class="hb">&#8942;</div></div>

<!-- Detect Section -->
<div class="detect-card">
<div class="detect-icon">&#128268;</div>
<div class="detect-status">检测到 Chrome 已安装</div>
<div class="detect-sub">版本 139.0.7258.128 · 可用</div>
<button class="detect-btn">重新检测浏览器</button>
</div>

<!-- Config Form -->
<div class="config-card">
<div class="cfg-title">&#9998; 浏览器配置</div>
<div class="cfg-row"><div class="cfg-label">&#128194; Chrome 可执行路径</div><input class="cfg-input" value="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" readonly></div>
<div class="cfg-row"><div class="cfg-label">&#128736; 启动参数</div><input class="cfg-input" value="--remote-debugging-port=9222 --no-first-run" readonly></div>
<div class="cfg-row"><div class="cfg-label">&#128221; 用户数据目录</div><input class="cfg-input" value="/Users/vim/Library/Application Support/Google/Chrome/Default" readonly></div>
<div class="cfg-actions">
<button class="cfg-btn cfg-primary">保存配置</button>
<button class="cfg-btn cfg-outline">恢复默认</button>
</div>
</div>

<!-- Download -->
<div class="download-card">
<div class="dl-header"><div class="dl-title">&#128228; Chrome 下载</div><div class="dl-chip dlc-green">最新版</div></div>
<div class="dl-item">
<div class="dl-icon di-blue">&#127760;</div>
<div class="dl-info"><div class="dl-name">Google Chrome</div><div class="dl-ver">139.0.7258.128 · macOS ARM64</div></div>
<button class="dl-btn db-primary">下载</button>
</div>
<div class="dl-item">
<div class="dl-icon di-green">&#9881;</div>
<div class="dl-info"><div class="dl-name">ChromeDriver</div><div class="dl-ver">139.0.0 · 匹配当前 Chrome</div></div>
<button class="dl-btn db-outline">下载</button>
</div>
</div>

<!-- Validation Result -->
<div class="valid-card">
<div class="vld-header"><div class="vld-title">&#10003;&#65039; 验证结果</div><div class="vld-check vld-ok">&#10003;</div></div>
<div class="vld-item"><div class="vld-dot vd-ok"></div><div class="vld-text">Chrome 已安装在系统路径中</div><div class="vld-result vr-ok">通过</div></div>
<div class="vld-item"><div class="vld-dot vd-ok"></div><div class="vld-text">调试端口 9222 可用</div><div class="vld-result vr-ok">通过</div></div>
<div class="vld-item"><div class="vld-dot vd-ok"></div><div class="vld-text">Cookie 存储目录可读写</div><div class="vld-result vr-ok">通过</div></div>
<div class="vld-item"><div class="vld-dot vd-warn"></div><div class="vld-text">用户数据目录占用 1.2GB</div><div class="vld-result vr-warn">警告</div></div>
</div>

<!-- Full Scan -->
<div class="scan-area"><button class="scan-btn scan-primary">&#128269; 全量扫描</button></div>
</div>
</div>
</body>
</html>
