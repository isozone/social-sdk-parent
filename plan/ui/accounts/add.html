<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加账号 - AI 鱼多宝</title>
<style>
:root{--brand:#4f46e5;--violet:#7c3aed;--gradient-brand:linear-gradient(135deg,#4f46e5,#7c3aed);--bg-page:#f5f5f7;--bg-card:#ffffff;--bg-input:#f8f8f9;--text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;--warning:#f59e0b;--danger:#ef4444;--border:#e5e7eb;--shadow-sm:0 1px 3px rgba(0,0,0,.04);--radius-sm:12px;--radius-md:16px;--radius-lg:24px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,'PingFang SC',system-ui,sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.phone-frame{width:393px;height:852px;border-radius:54px;background:var(--bg-page);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--text-primary)}.nav-bar{position:absolute;top:58px;left:0;right:0;height:44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);z-index:50}.back-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bg-page);cursor:pointer;transition:all .2s}.back-btn:active{transform:scale(.92)}.page-content{position:absolute;top:102px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}.page-content::-webkit-scrollbar{display:none}
/* Hero */
.hero-overlay{background:var(--gradient-brand);padding:16px 20px 36px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}.hero-overlay::before{content:'';position:absolute;top:-40%;right:-10%;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);border-radius:50%}.hero-content{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.hero-icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:24px}.hero-text h2{font-size:20px;font-weight:800;color:#fff}.hero-text p{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
/* Form */
.form-section{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:16px;margin:0 16px 16px}.form-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:14px;display:flex;align-items:center;gap:8px}.form-title::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--brand);flex-shrink:0}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field-label{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:7px;display:block}.field-input{width:100%;height:46px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;font-size:14px;color:var(--text-primary);outline:none;transition:all .25s}.field-input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1)}.field-input::placeholder{color:var(--text-tertiary)}textarea.field-input{height:120px;padding:12px 14px;resize:none;line-height:1.5;font-family:'SF Mono','Menlo','Monaco',monospace;font-size:11px;color:var(--text-secondary)}.field-hint{font-size:11px;color:var(--text-tertiary);margin-top:5px}
/* Tip */
.tip-card{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);border-radius:var(--radius-md);padding:14px 16px;margin:0 16px 16px}.tip-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warning);margin-bottom:6px}.tip-text{font-size:12px;color:var(--text-secondary);line-height:1.6}
/* Submit */
.submit-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);height:52px;border-radius:var(--radius-sm);background:var(--gradient-brand);border:none;font-size:16px;font-weight:700;color:#fff;cursor:pointer;margin:0 16px 24px;box-shadow:0 8px 32px rgba(79,70,229,.35);transition:transform .3s}.submit-btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg><svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg></span></div>
  <div class="nav-bar"><button class="back-btn" onclick="location.href='list.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button><span style="font-size:17px;font-weight:700;color:var(--text-primary)">添加账号</span><div></div></div>
  <div class="page-content">
    <div class="hero-overlay"><div class="hero-content"><div class="hero-icon">🔗</div><div class="hero-text"><h2>绑定新账号</h2><p>粘贴 Cookie 即可快速同步</p></div></div></div>
    <div class="form-section"><div class="form-title">账号信息</div><div class="field"><label class="field-label">账号名称</label><input class="field-input" placeholder="给自己取的友好名称"></div><div class="field"><label class="field-label">备注（可选）</label><input class="field-input" placeholder="用于记录更多信息"></div></div>
    <div class="form-section"><div class="form-title">Cookie 配置</div><div class="field"><label class="field-label">Cookie</label><textarea class="field-input" placeholder="从浏览器开发者工具复制完整的 Cookie Header"></textarea><div class="field-hint">打开闲鱼 → F12 → Network → 复制任意请求的 Cookie 头</div></div></div>
    <div class="tip-card"><div class="tip-header"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>安全提示</div><div class="tip-text">Cookie 将在本地加密存储（AES-256），我们不会将你的 Cookie 上传至第三方服务器。</div></div>
    <button class="submit-btn">🔗 绑 定 账 号</button>
  </div>
</div>
</body>
</html>
