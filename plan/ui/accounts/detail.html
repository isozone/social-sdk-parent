<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>账号详情 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Inter',system-ui,sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone-frame{width:393px;height:852px;border-radius:54px;background:#f5f5f7;position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:13px;font-weight:600;color:#111827}
.page-content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.page-content::-webkit-scrollbar{display:none}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-bar{position:absolute;top:58px;left:0;right:0;height:44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #f3f4f6;z-index:50}
.back-btn{display:flex;align-items:center;gap:4px;font-size:15px;color:#4f46e5;cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600}
.nav-title{font-size:17px;font-weight:700;color:#111827}

/* Profile Header */
.profile-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:20px 16px 32px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.profile-header::before{content:'';position:absolute;top:-40%;right:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%);border-radius:50%}
.header-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.account-avatar-large{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid rgba(255,255,255,.25)}
.account-name-large{font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.1)}
.account-id{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.status-badge-large{padding:5px 12px;border-radius:12px;font-size:11px;font-weight:700;position:absolute;top:20px;right:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge-active{background:rgba(16,185,129,.2);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.badge-warning{background:rgba(245,158,11,.2);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.badge-paused{background:rgba(156,163,175,.2);color:#9ca3af;border:1px solid rgba(156,163,175,.3)}

/* Health Ring */
.health-card{margin:-20px 16px 0;background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.08);position:relative;z-index:2;text-align:center}
.health-ring{width:80px;height:80px;margin:0 auto 10px}
.health-ring svg{width:80px;height:80px;transform:rotate(-90deg)}
.health-ring circle{fill:none;stroke-width:5}
.health-ring .bg{stroke:#f3f4f6}
.health-ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.health-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.health-val{font-size:22px;font-weight:800;line-height:1}
.health-label{font-size:9px;color:#9ca3af;font-weight:500}
.health-text{font-size:13px;font-weight:600;color:#111827}
.health-sub{font-size:11px;color:#9ca3af;margin-top:2px}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px}
.stat-box{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.stat-box-value{font-size:20px;font-weight:800;color:#111827}
.stat-box-label{font-size:10px;color:#9ca3af;margin-top:4px}

/* Info Card */
.info-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.03);overflow:hidden;margin:0 16px 12px}
.info-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #f3f4f6}
.info-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.info-title{font-size:14px;font-weight:700;color:#111827}
.info-body{padding:12px 16px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8f8f9}
.info-row:last-child{border-bottom:none}
.info-label{font-size:12px;color:#9ca3af}
.info-value{font-size:12px;color:#111827;font-weight:500}

/* Toggle Switch */
.toggle-switch{position:relative;width:44px;height:24px;border-radius:12px;background:#10b981;cursor:pointer;transition:background .3s}
.toggle-switch.off{background:#d1d5db}
.toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .3s cubic-bezier(.16,1,.3,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch.off .toggle-knob{left:22px}

/* Actions */
.action-btn{width:calc(50% - 6px);height:44px;border-radius:14px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .2s;margin:0 8px 16px;display:flex;align-items:center;justify-content:center;gap:6px}
.action-btn:active{transform:scale(.97)}
.action-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.25)}
.action-danger{background:#fff;color:#ef4444;border:1px solid #fecaca}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <div class="nav-bar">
    <button class="back-btn" onclick="location.href='list.html'">← 返回</button>
    <span class="nav-title">账号详情</span>
    <span></span>
  </div>

  <div class="page-content">
    <!-- Profile Header -->
    <div class="profile-header">
      <span class="status-badge-large badge-active">● 运行中</span>
      <div class="header-row">
        <div class="account-avatar-large">🐟</div>
        <div>
          <div class="account-name-large">闲鱼-主力号</div>
          <div class="account-id">Account ID: 100001 · 创建于 2026-01-15</div>
        </div>
      </div>
    </div>

    <!-- Health Ring -->
    <div class="health-card">
      <div class="health-ring">
        <svg viewBox="0 0 80 80">
          <circle class="bg" cx="40" cy="40" r="34"/>
          <circle class="fg" cx="40" cy="40" r="34" stroke="#10b981" stroke-dasharray="213.6" stroke-dashoffset="10.7"/>
        </svg>
        <div class="health-num">
          <span class="health-val" style="color:#10b981">96</span>
          <span class="health-label">健康分</span>
        </div>
      </div>
      <div class="health-text">账号状态良好</div>
      <div class="health-sub">Cookie 有效期至 2026-08-10 · 距过期 16 天</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-box-value" style="color:#4f46e5">156</div><div class="stat-box-label">商品数</div></div>
      <div class="stat-box"><div class="stat-box-value" style="color:#10b981">23</div><div class="stat-box-label">今日订单</div></div>
      <div class="stat-box"><div class="stat-box-value" style="color:#d97706">12</div><div class="stat-box-label">待处理</div></div>
    </div>

    <!-- Account Info -->
    <div class="info-card">
      <div class="info-head"><div class="info-icon" style="background:rgba(79,70,229,.08)">📋</div><div class="info-title">账号信息</div></div>
      <div class="info-body">
        <div class="info-row"><span class="info-label">显示名称</span><span class="info-value">闲鱼-主力号</span></div>
        <div class="info-row"><span class="info-label">闲鱼昵称</span><span class="info-value">Vimの杂货铺</span></div>
        <div class="info-row"><span class="info-label">账号等级</span><span class="info-value">黄金卖家</span></div>
        <div class="info-row"><span class="info-label">自动回复</span><span class="info-value" style="display:flex;align-items:center;gap:8px">已开启 <div class="toggle-switch" style="transform:scale(.8)"><div class="toggle-knob"></div></div></span></div>
      </div>
    </div>

    <!-- Cookie Status -->
    <div class="info-card">
      <div class="info-head"><div class="info-icon" style="background:rgba(34,211,238,.1)">🍪</div><div class="info-title">Cookie 状态</div></div>
      <div class="info-body">
        <div class="info-row"><span class="info-label">状态</span><span class="info-value" style="color:#10b981;font-weight:600">● 有效</span></div>
        <div class="info-row"><span class="info-label">更新时间</span><span class="info-value">2026-07-25 08:30</span></div>
        <div class="info-row"><span class="info-label">过期时间</span><span class="info-value">2026-08-10 08:30</span></div>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;justify-content:center;flex-wrap:wrap">
      <button class="action-btn action-primary" onclick="window.location.reload()">🔄 同步资料</button>
      <button class="action-btn action-danger" onclick="location.href='#'">⏸ 暂停账号</button>
    </div>
  </div>
</div>
</body>
</html>
