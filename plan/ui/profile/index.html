<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>个人中心 - AI 鱼多宝</title>
<style>
:root{--brand:#4f46e5;--violet:#7c3aed;--cyan:#22d3ee;--gradient-brand:linear-gradient(135deg,#4f46e5,#7c3aed);--bg-page:#f5f5f7;--bg-card:#fff;--text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;--danger:#ef4444;--border:#e5e7eb;--border-light:#f3f4f6;--shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow-md:0 4px 12px rgba(0,0,0,.06);--radius-sm:12px;--radius-md:16px;--radius-full:9999px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Inter',system-ui,sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone-frame{width:393px;height:852px;border-radius:54px;background:var(--bg-page);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:13px;font-weight:600;color:var(--text-primary)}
.page-content{position:absolute;top:58px;left:0;right:0;bottom:84px;overflow-y:auto;overflow-x:hidden}
.page-content::-webkit-scrollbar{display:none}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0)}
/* Nav */
.nav-bar{position:absolute;top:58px;left:0;right:0;height:44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-light);z-index:50}
.nav-title{font-size:17px;font-weight:700;color:var(--text-primary)}
.nav-btn{position:absolute;right:16px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bg-page);cursor:pointer;transition:all .2s}
.nav-btn:active{transform:scale(.92);background:var(--border-light)}
/* Hero */
.profile-hero{background:var(--gradient-brand);padding:20px 20px 36px;border-radius:0 0 32px 32px;position:relative;overflow:hidden;text-align:center}
.profile-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:220px;height:220px;background:radial-gradient(circle,rgba(34,211,238,.16),transparent 70%);border-radius:50%}
.avatar-wrap{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px;position:relative;z-index:1;backdrop-filter:blur(10px)}
.profile-name{font-size:22px;font-weight:800;color:#fff;text-align:center;position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.12)}
.profile-role{font-size:12px;color:rgba(255,255,255,.65);text-align:center;position:relative;z-index:1;margin-top:3px}
.profile-meta{display:flex;gap:24px;justify-content:center;margin-top:18px;position:relative;z-index:1}
.meta-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.meta-num{font-size:20px;font-weight:800;color:#fff}
.meta-label{font-size:10px;color:rgba(255,255,255,.55)}
/* Quick Stats */
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px;margin-top:-18px;position:relative;z-index:2}
.qs-card{background:var(--bg-card);border-radius:var(--radius-md);padding:16px 12px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-md)}
.qs-val{font-size:18px;font-weight:800;color:var(--text-primary)}
.qs-label{font-size:10px;color:var(--text-tertiary);margin-top:3px}
/* Menu Sections */
.menu-section{background:var(--bg-card);border-radius:var(--radius-md);margin:16px;padding:4px 0;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;transition:background .15s}
.menu-item:active{background:var(--bg-page)}
.menu-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mi-violet{background:rgba(79,70,229,.08);color:var(--brand)}.mi-cyan{background:rgba(34,211,238,.1);color:#0891b2}.mi-green{background:rgba(16,185,129,.08);color:var(--success)}.mi-amber{background:rgba(245,158,11,.08);color:#d97706}.mi-red{background:rgba(239,68,68,.08);color:var(--danger)}.mi-blue{background:rgba(59,130,246,.08);color:var(--info)}
.menu-text{flex:1;text-align:left}
.menu-title{font-size:15px;font-weight:500;color:var(--text-primary)}.menu-desc{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.menu-arrow{color:var(--text-tertiary);font-size:16px}
.menu-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center}
/* Info Rows */
.info-section{background:var(--bg-card);border-radius:var(--radius-md);margin:0 16px;padding:4px 0;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border-light)}
.info-row:last-child{border-bottom:none}
.info-label{font-size:14px;color:var(--text-secondary)}.info-value{font-size:14px;color:var(--text-primary);font-weight:500}
/* Logout */
.logout-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);height:48px;border-radius:var(--radius-sm);margin:24px 16px;background:var(--bg-card);border:1px solid var(--border);font-size:15px;font-weight:600;color:var(--danger);cursor:pointer;box-shadow:var(--shadow-sm);transition:all .2s}
.logout-btn:active{transform:scale(.97)}
/* TabBar */
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--border-light);display:flex;z-index:80;padding-bottom:8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .15s}
.tab-item:active{transform:scale(.9)}
.tab-icon{font-size:22px;line-height:1}
.tab-label{font-size:10px;color:var(--text-tertiary);font-weight:400;transition:all .2s}
.tab-item.active .tab-icon{color:var(--brand)}.tab-item.active .tab-label{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:4px;align-items:center">
    <svg width="14" height="11" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="14" height="11" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="24" height="11" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <!-- Nav -->
  <div class="nav-bar">
    <span class="nav-title">我的</span>
    <div class="nav-btn">⋮</div>
  </div>

  <div class="page-content">
    <!-- Profile Hero -->
    <div class="profile-hero">
      <div class="avatar-wrap">🐟</div>
      <div class="profile-name">Vim 老师</div>
      <div class="profile-role">超级管理员 · Admin</div>
      <div class="profile-meta">
        <div class="meta-item"><div class="meta-num">156</div><div class="meta-label">商品</div></div>
        <div class="meta-item"><div class="meta-num">3</div><div class="meta-label">账号</div></div>
        <div class="meta-item"><div class="meta-num">47</div><div class="meta-label">订单</div></div>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="quick-stats">
      <div class="qs-card"><div class="qs-val" style="color:var(--brand)">¥32.6k</div><div class="qs-label">月销售额</div></div>
      <div class="qs-card"><div class="qs-val" style="color:var(--success)">96</div><div class="qs-label">平均健康分</div></div>
      <div class="qs-card"><div class="qs-val" style="color:var(--violet)">92%</div><div class="qs-label">回复匹配率</div></div>
    </div>

    <!-- Info -->
    <div class="info-section">
      <div class="info-row"><span class="info-label">用户名</span><span class="info-value">vim_official</span></div>
      <div class="info-row"><span class="info-label">邮箱</span><span class="info-value">vim@example.com</span></div>
      <div class="info-row"><span class="info-label">手机</span><span class="info-value">138****8888</span></div>
    </div>

    <!-- Account Section -->
    <div class="menu-section">
      <div class="menu-item"><div class="menu-icon mi-violet">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div><div class="menu-text"><div class="menu-title">账号管理</div><div class="menu-desc">管理闲鱼账号与 Cookie</div></div><span class="menu-arrow">›</span></div>
      <div class="menu-item"><div class="menu-icon mi-cyan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      </div><div class="menu-text"><div class="menu-title">钱包资产</div><div class="menu-desc">余额、冻结、可提现</div></div><span class="menu-arrow">›</span></div>
    </div>

    <!-- Settings Section -->
    <div class="menu-section">
      <div class="menu-item"><div class="menu-icon mi-green">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </div><div class="menu-text"><div class="menu-title">修改密码</div><div class="menu-desc">安全设置</div></div><span class="menu-arrow">›</span></div>
      <div class="menu-item"><div class="menu-icon mi-amber">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-1.82-.33l-.06-.06a2 2 0 012.83-2.83l.06-.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06A1.65 1.65 0 0012 15a1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4"/></svg>
      </div><div class="menu-text"><div class="menu-title">设置</div><div class="menu-desc">通知偏好、自动回复配置</div></div><span class="menu-arrow">›</span></div>
      <div class="menu-item"><div class="menu-icon mi-blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div><div class="menu-text"><div class="menu-title">帮助与反馈</div><div class="menu-desc">使用指南 & 问题反馈</div></div><span class="menu-arrow">›</span></div>
    </div>

    <!-- Notifications -->
    <div class="menu-section">
      <div class="menu-item"><div class="menu-icon mi-amber">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </div><div class="menu-text"><div class="menu-title">通知中心</div><div class="menu-desc">查看系统通知</div></div><span class="menu-badge">3</span><span class="menu-arrow">›</span></div>
    </div>

    <!-- Logout -->
    <button class="logout-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      退出登录
    </button>
  </div>

  <!-- TabBar -->
  <div class="tab-bar safe-bottom">
    <div class="tab-item"><span class="tab-icon">📊</span><span class="tab-label">首页</span></div>
    <div class="tab-item"><span class="tab-icon">💬</span><span class="tab-label">消息</span></div>
    <div class="tab-item"><span class="tab-icon">🛒</span><span class="tab-label">商品</span></div>
    <div class="tab-item active"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>
</body>
</html>
