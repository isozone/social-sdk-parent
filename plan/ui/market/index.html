<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}:root{--brand:#4f46e5;--violet:#7c3aed;--cyan:#22d3ee;--bg-page:#f5f5f7;--text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--border:#e5e7eb;--radius-md:16px;--gradient-brand:linear-gradient(135deg,#4f46e5,#7c3aed)}.phone{width:393px;height:852px;border-radius:54px;background:var(--bg-page);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--text-primary)}.page-content{position:absolute;top:58px;left:0;right:0;bottom:84px;overflow-y:auto;-webkit-overflow-scrolling:touch}.page-content::-webkit-scrollbar{display:none}.nav{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.h-title{font-size:17px;font-weight:700;color:var(--text-primary);flex:1;text-align:center}.card{background:#fff;border-radius:var(--radius-md);padding:16px;border:1px solid var(--border);margin:0 16px 12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}.section-title{font-size:16px;font-weight:700;color:var(--text-primary)}.section-link{font-size:12px;color:var(--brand);font-weight:600;text-decoration:none}.keyword-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-light)}.keyword-row:last-child{border-bottom:none}.keyword-name{flex:1;font-size:14px;font-weight:600;color:var(--text-primary)}.keyword-trend{font-size:12px;font-weight:700}.trend-up{color:var(--danger)}.trend-down{color:var(--success)}.badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600}.badge-hot{background:rgba(239,68,68,.1);color:var(--danger)}.badge-warm{background:rgba(245,158,11,.1);color:var(--warning)}.chart-area{height:100px;display:flex;align-items:end;gap:4px;padding:12px 8px 0}.chart-bar{flex:1;background:var(--gradient-brand);border-radius:4px 4px 0 0;min-height:8px;transition:height .3s}.filter-bar{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}.filter-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;background:#fff;border:1px solid var(--border);color:var(--text-secondary)}.filter-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 16px 12px}.stat-box{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border)}.stat-value{font-size:20px;font-weight:800;color:var(--text-primary)}.stat-label{font-size:10px;color:var(--text-tertiary);margin-top:2px}.add-btn{position:absolute;bottom:100px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--gradient-brand);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(79,70,229,.35);z-index:50}
</style>
</head>
