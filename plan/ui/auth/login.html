<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - AI 鱼多宝</title>
<link rel="stylesheet" href="../_design-system.css">
<style>
body{background:#0b0f1a}
.login-page{color:#fff;display:flex;flex-direction:column;height:100%;padding:100px 24px 0;z-index:10;position:relative}
.app-logo{width:72px;height:72px;border-radius:50%;background:var(--gradient-brand);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;box-shadow:0 8px 32px rgba(79,70,229,.5)}
.app-title{font-size:28px;font-weight:800;text-align:center;letter-spacing:2px;color:#fff}
.app-subtitle{font-size:13px;text-align:center;color:rgba(255,255,255,.4);margin-top:4px}
.login-form{margin-top:48px;background:rgba(255,255,255,.06);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px 20px}
.form-group{margin-bottom:20px}
.form-label{font-size:12px;font-weight:600;color:rgba(255,255,255,.4);margin-bottom:8px;display:block;letter-spacing:.5px;text-transform:uppercase}
.form-input{width:100%;height:50px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:0 16px 0 46px;font-size:15px;color:#fff;outline:none;font-family:inherit}
.form-input::placeholder{color:rgba(255,255,255,.25)}
.form-input:focus{border-color:#4f46e5;background:rgba(79,70,229,.12)}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35)}
.password-wrap{position:relative}
.toggle-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:16px}
.login-btn{width:100%;height:54px;border:none;border-radius:14px;background:var(--gradient-brand);color:#fff;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:4px;box-shadow:0 8px 32px rgba(79,70,229,.4);transition:all .3s}
.login-btn:active{transform:scale(.97)}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.login-divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.login-divider-text{font-size:11px;color:rgba(255,255,255,.2)}
.platform-row{display:flex;gap:10px}
.platform-btn{flex:1;height:48px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}
.platform-btn:active{background:rgba(255,255,255,.08);transform:scale(.96)}
.foot-note{text-align:center;margin-top:32px;padding:0 24px}
.foot-tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.foot-tag{padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:10px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="orb-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="status-bar status-bar--white"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#fff" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <div class="login-page">
    <div class="app-logo">🐟</div>
    <h1 class="app-title">AI 鱼多宝</h1>
    <p class="app-subtitle">轻量级闲鱼经营助手</p>

    <div class="login-form">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <div class="password-wrap">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" class="form-input" placeholder="请输入用户名">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="password-wrap">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" class="form-input" placeholder="请输入密码">
          <button class="toggle-pwd">👁</button>
        </div>
      </div>
      <button class="login-btn">登 录</button>
    </div>

    <div class="foot-note">
      <div class="foot-tags">
        <span class="foot-tag">🔒 HTTPS 加密传输</span>
        <span class="foot-tag">⚡ 支持 9 大平台</span>
        <span class="foot-tag">✅ 24h Token 有效期</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
