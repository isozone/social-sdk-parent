<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录页 - AI 鱼多宝</title>
<style>
:root {
  --brand: #4f46e5;
  --violet: #7c3aed;
  --cyan: #22d3ee;
  --bg-dark: #0a0f1e;
  --text-white: #f9fafb;
  --text-muted: rgba(255,255,255,.6);
  --border-glass: rgba(255,255,255,.1);
  --shadow-brand: 0 8px 32px rgba(79,70,229,.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'PingFang SC', 'Inter', sans-serif;
  background: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

/* Phone Frame */
.phone-frame {
  width: 393px;
  height: 852px;
  border-radius: 54px;
  background: var(--bg-dark);
  position: relative;
  overflow: hidden;
  box-shadow: 
    0 0 0 3px #1f2937,
    0 50px 150px rgba(0,0,0,.5);
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
}

/* Status Bar */
.status-bar {
  position: absolute;
  top: 58px;
  left: 32px;
  right: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-white);
  font-size: 14px;
  font-weight: 600;
  z-index: 90;
}

.status-icons {
  display: flex;
  gap: 6px;
  align-items: center;
}

/* Orb Background */
.orb-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
}

.orb-1 {
  width: 320px;
  height: 320px;
  top: -80px;
  left: -80px;
  background: radial-gradient(circle, rgba(124,58,237,.4), transparent 70%);
  animation: float 8s ease-in-out infinite;
}

.orb-2 {
  width: 260px;
  height: 260px;
  bottom: -60px;
  right: -60px;
  background: radial-gradient(circle, rgba(34,211,238,.28), transparent 70%);
  animation: float2 10s ease-in-out infinite;
}

.orb-3 {
  width: 200px;
  height: 200px;
  top: 40%;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(79,70,229,.25), transparent 70%);
  animation: pulse 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(14px, -16px); }
}

@keyframes float2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-16px, 14px); }
}

@keyframes pulse {
  0%, 100% { opacity: .2; }
  50% { opacity: .45; }
}

/* Content Area */
.page-content {
  position: relative;
  z-index: 10;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 120px 24px 40px;
}

/* Logo Section */
.logo-section {
  text-align: center;
  margin-bottom: 48px;
}

.logo-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), var(--violet));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin: 0 auto 16px;
  box-shadow: 0 8px 32px rgba(79,70,229,.5);
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(79,70,229,.4); }
  50% { transform: scale(1.03); box-shadow: 0 12px 40px rgba(79,70,229,.6); }
}

.app-name {
  font-size: 28px;
  font-weight: 800;
  color: var(--text-white);
  letter-spacing: 2px;
  text-shadow: 0 2px 12px rgba(79,70,229,.4);
}

.app-slogan {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 8px;
  letter-spacing: 1px;
}

/* Glass Card */
.glass-card {
  background: rgba(255,255,255,.06);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  padding: 28px 24px;
  box-shadow: 
    0 28px 80px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* Input Groups */
.input-group {
  margin-bottom: 20px;
}

.input-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.input-field {
  width: 100%;
  height: 52px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  padding: 0 48px 0 16px;
  font-size: 15px;
  color: var(--text-white);
  outline: none;
  transition: all .3s cubic-bezier(.16,1,.3,1);
}

.input-field::placeholder {
  color: rgba(255,255,255,.35);
}

.input-field:focus {
  border-color: var(--brand);
  background: rgba(79,70,229,.12);
  box-shadow: 0 0 0 4px rgba(79,70,229,.15);
}

.input-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  opacity: .6;
}

/* Remember Row */
.remember-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.remember-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
}

.checkbox {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1.5px solid rgba(255,255,255,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--brand);
  transition: all .2s;
}

.checkbox.checked {
  background: var(--brand);
  border-color: var(--brand);
}

.forgot-link {
  font-size: 13px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color .2s;
}

.forgot-link:hover {
  color: var(--text-white);
}

/* Login Button */
.login-btn {
  width: 100%;
  height: 54px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--brand), var(--violet));
  border: none;
  color: var(--text-white);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: var(--shadow-brand);
  transition: all .3s cubic-bezier(.16,1,.3,1);
  position: relative;
  overflow: hidden;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(79,70,229,.6);
}

.login-btn:active {
  transform: scale(.97);
  box-shadow: 0 4px 16px rgba(79,70,229,.3);
}

.login-btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  transition: left .6s ease;
}

.login-btn:hover::after {
  left: 100%;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 28px 0;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
}

.divider-text {
  font-size: 12px;
  color: rgba(255,255,255,.3);
  white-space: nowrap;
}

/* Quick Login */
.quick-login {
  display: flex;
  gap: 12px;
}

.platform-btn {
  flex: 1;
  height: 52px;
  border-radius: 16px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .2s cubic-bezier(.16,1,.3,1);
}

.platform-btn:hover {
  background: rgba(255,255,255,.1);
  border-color: rgba(255,255,255,.2);
  color: var(--text-white);
}

.platform-btn:active {
  transform: scale(.95);
}

.platform-icon {
  font-size: 20px;
}

/* Footer */
.footer-note {
  text-align: center;
  margin-top: 32px;
}

.footer-tags {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.footer-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: rgba(255,255,255,.4);
}

/* Safe Area Bottom */
.safe-bottom {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Responsive */
@media (max-height: 700px) {
  .logo-section { margin-bottom: 32px; }
  .glass-card { padding: 24px 20px; }
}

@media (max-width: 420px) {
  body { padding: 12px; }
  .phone-frame {
    width: 100%;
    max-width: 393px;
    height: auto;
    aspect-ratio: 393/852;
  }
}

@media (min-width: 768px) {
  .phone-frame {
    width: 414px;
    height: 896px;
  }
}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="dynamic-island"></div>
  
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="15" height="12" viewBox="0 0 16 12" fill="currentColor">
        <path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z"/>
        <path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/>
      </svg>
      <svg width="15" height="12" viewBox="0 0 16 12" fill="currentColor">
        <rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/>
        <rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/>
        <rect x="10" y="0" width="3" height="12" rx=".5"/>
      </svg>
      <svg width="26" height="12" viewBox="0 0 28 12" fill="none">
        <rect x=".5" y=".5" width="23" height="11" rx="3" stroke="currentColor"/>
        <rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/>
      </svg>
    </div>
  </div>

  <!-- Orb Background -->
  <div class="orb-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Page Content -->
  <div class="page-content">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-icon">🐟</div>
      <h1 class="app-name">AI 鱼多宝</h1>
      <p class="app-slogan">轻量级闲鱼经营助手</p>
    </div>

    <!-- Glass Card -->
    <div class="glass-card">
      <!-- Account Input -->
      <div class="input-group" style="position: relative;">
        <label class="input-label">
          <span>账号</span>
        </label>
        <span class="input-icon">👤</span>
        <input 
          type="text" 
          class="input-field" 
          placeholder="请输入用户名或手机号"
        >
      </div>

      <!-- Password Input -->
      <div class="input-group" style="position: relative;">
        <label class="input-label">
          <span>密码</span>
        </label>
        <span class="input-icon">🔒</span>
        <input 
          type="password" 
          class="input-field" 
          placeholder="请输入密码"
        >
      </div>

      <!-- Remember Row -->
      <div class="remember-row">
        <label class="remember-label">
          <span class="checkbox checked">✓</span>
          <span>记住登录状态</span>
        </label>
        <a href="#" class="forgot-link">忘记密码？</a>
      </div>

      <!-- Login Button -->
      <button class="login-btn">登 录</button>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">或使用以下方式快速登录</span>
        <div class="divider-line"></div>
      </div>

      <!-- Quick Login -->
      <div class="quick-login">
        <button class="platform-btn">
          <span class="platform-icon">💬</span>
          <span>微信</span>
        </button>
        <button class="platform-btn">
          <span class="platform-icon">💰</span>
          <span>支付宝</span>
        </button>
        <button class="platform-btn">
          <span class="platform-icon">🎵</span>
          <span>抖音</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
      <div class="footer-tags">
        <span class="footer-tag">🔒 HTTPS 加密传输</span>
        <span class="footer-tag">✅ 支持 9 大平台</span>
        <span class="footer-tag">⚡ 24h Token 有效期</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
