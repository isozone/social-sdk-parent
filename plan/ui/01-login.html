<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>登录 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--dark:#0b0f1a;--surface:rgba(17,24,39,.6)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Helvetica Neue',sans-serif;background:var(--dark);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:54px;background:var(--dark);position:relative;overflow:hidden;box-shadow:0 0 0 3px #374151,0 50px 150px rgba(0,0,0,.5)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#f9fafb}
.status-bar .icons{display:flex;gap:5px;font-size:12px;align-items:center}
.bg-gradient{position:absolute;inset:0;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px)}
.orb-1{width:360px;height:360px;top:-80px;left:-100px;background:radial-gradient(circle,rgba(124,58,237,.45),transparent 70%);animation:float 8s ease-in-out infinite}
.orb-2{width:300px;height:300px;bottom:-60px;right:-80px;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 70%);animation:float2 10s ease-in-out infinite}
.orb-3{width:220px;height:220px;top:280px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(79,70,229,.3),transparent 70%);animation:pulse 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(15px,-18px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,15px)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.45}}
.grid-layer{position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(79,70,229,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(79,70,229,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%)}
.noise{position:absolute;inset:0;z-index:1;opacity:.03;background:radial-gradient(circle,#fff 1px,transparent 1px);background-size:4px 4px}
.content{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 28px 48px}
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.logo{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:18px;box-shadow:0 14px 44px rgba(79,70,229,.4),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.logo::after{content:'';position:absolute;inset:-5px;border-radius:28px;border:1px solid rgba(255,255,255,.12)}
.brand{font-size:30px;font-weight:700;color:#f9fafb;letter-spacing:1.5px}
.tagline{font-size:13px;color:rgba(156,163,175,.7);margin-top:6px;letter-spacing:.5px}
.glass{width:100%;margin-top:34px;background:var(--surface);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:28px 22px;box-shadow:0 28px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.input-group{margin-bottom:18px}
.input-label{display:block;font-size:12px;font-weight:500;color:#9ca3af;margin-bottom:8px;letter-spacing:.5px}
.input-field{width:100%;height:52px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:0 16px;color:#f9fafb;font-size:15px;outline:none;transition:all .3s cubic-bezier(.16,1,.3,1)}
.input-field:focus{border-color:rgba(99,102,241,.7);background:rgba(79,70,229,.1);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.input-field::placeholder{color:#6b7280}
.input-prefix{position:relative}
.input-prefix .input-field{padding-left:46px}
.input-prefix svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#6b7280}
.input-suffix{position:relative}
.input-suffix .input-field{padding-right:46px}
.input-suffix .show-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#6b7280;font-size:18px;user-select:none}
.remember-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.remember{display:flex;align-items:center;gap:7px;font-size:12px;color:#9ca3af;cursor:pointer}
.check{width:17px;height:17px;border-radius:5px;border:1.5px solid rgba(255,255,255,.2);background:rgba(99,102,241,.15);display:flex;align-items:center;justify-content:center;font-size:10px;color:#818cf8;transition:all .2s}
.forgot{font-size:12px;color:#a78bfa;text-decoration:none;transition:color .2s}
.login-btn{width:100%;height:54px;background:linear-gradient(135deg,var(--brand),var(--brand-2));border:none;border-radius:16px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;letter-spacing:1.5px;box-shadow:0 8px 32px rgba(79,70,229,.45);transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(79,70,229,.55)}
.login-btn:active{transform:translateY(0) scale(.98)}
.login-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transition:left .6s}
.login-btn:hover::after{left:100%}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:#6b7280;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.quick-logins{display:flex;justify-content:center;gap:18px}
.quick-btn{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:all .25s cubic-bezier(.16,1,.3,1);color:#9ca3af}
.quick-btn:hover{background:rgba(255,255,255,.1);color:#f9fafb;transform:translateY(-3px);border-color:rgba(255,255,255,.15)}
.slogan{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:12px;color:rgba(156,163,175,.25);letter-spacing:1px;z-index:5}
.bottom-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;z-index:100}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="icons">
      <svg width="15" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
      <svg width="15" height="12" viewBox="0 0 16 12" fill="#fff"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
      <svg width="26" height="12" viewBox="0 0 28 12" fill="#fff"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#fff" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/><rect x="24" y="3.5" width="2.5" height="5" rx=".5" fill="#fff" opacity=".5"/></svg>
    </span>
  </div>
  <div class="bg-gradient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-layer"></div>
  </div>
  <div class="content">
    <div class="logo-wrap">
      <div class="logo">🐟</div>
    </div>
    <div class="brand">AI 鱼多宝</div>
    <div class="tagline">闲鱼卖家智能经营助手</div>
    <div class="glass">
      <div class="input-group">
        <label class="input-label">用户名</label>
        <div class="input-prefix">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>
          <input class="input-field" type="text" placeholder="请输入用户名或手机号">
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">密码</label>
        <div class="input-suffix">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input class="input-field" type="password" placeholder="请输入密码">
          <span class="show-pwd">&#128065;</span>
        </div>
      </div>
      <div class="remember-row">
        <label class="remember"><span class="check">&#10003;</span> 记住我</label>
        <a href="#" class="forgot">忘记密码？</a>
      </div>
      <button class="login-btn">登 录</button>
      <div class="divider">其他登录方式</div>
      <div class="quick-logins">
        <div class="quick-btn" title="微信登录">💬</div>
        <div class="quick-btn" title="扫码登录">📷</div>
        <div class="quick-btn" title="短信验证码">📱</div>
      </div>
    </div>
  </div>
  <div class="slogan">随时随地 掌舵经营</div>
  <div class="bottom-indicator"></div>
</div>
</body>
</html>
