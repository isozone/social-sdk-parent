<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>账号详情 - AI 鱼多宝</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,'PingFang SC','SF Pro Display',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}:root{--brand:#4f46e5;--violet:#7c3aed;--cyan:#22d3ee;--bg:#f5f5f7;--t1:#111827;--t2:#6b7280;--t3:#9ca3af;--border:#e5e7eb;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.st{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--t1)}.ct{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.ct::-webkit-scrollbar{display:none}.hd{padding:10px 16px 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}.bk{font-size:22px;color:var(--t2);cursor:pointer;padding:4px}.pt{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--t1);margin-right:28px}.more{font-size:20px;color:var(--t2);cursor:pointer}
.ac-hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:24px 20px;color:#fff;position:relative;overflow:hidden;border-radius:0 0 24px 24px}
.ac-hero::before{content:'';position:absolute;top:-30%;right:-10%;width:160px;height:160px;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%);border-radius:50%}
.ac-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ac-avatar{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.ac-name{font-size:20px;font-weight:700}
.ac-nick{font-size:12px;opacity:.7;margin-top:2px}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(16,185,129,.15);color:#34d399;backdrop-filter:blur(8px);border:1px solid rgba(52,211,153,.3)}
.status-badge.warn{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.sg-item{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.sg-val{font-size:20px;font-weight:800;color:var(--t1)}.sg-label{font-size:11px;color:var(--t3);margin-top:3px}
.sg-sub{font-size:10px;color:var(--t2);margin-top:2px}
.info-list{background:#fff;margin:0 16px;border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.il{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f8fafc}
.il:last-child{border-bottom:none}
.il-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.il-text{flex:1}.il-l{font-size:14px;color:var(--t2)}.il-v{font-size:14px;color:var(--t1);font-weight:500;margin-top:2px}
.il-arrow{color:var(--t3);font-size:16px}
.expire-bar{background:#fff;margin:16px 16px 12px;padding:16px;border-radius:16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.expire-label{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.expire-track{height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden}
.expire-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),var(--violet));transition:width .6s cubic-bezier(.16,1,.3,1)}
.expire-info{font-size:11px;color:var(--t3);margin-top:6px;text-align:right}
.actions{display:flex;gap:10px;padding:16px;position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.act-btn{flex:1;padding:12px 0;border-radius:14px;font-size:14px;font-weight:600;text-align:center;border:none;cursor:pointer;transition:transform .15s}
.act-btn:active{transform:scale(.97)}
.act-btn.primary{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.25)}
.act-btn.secondary{background:#f3f4f6;color:var(--t2)}
.act-btn.danger{background:rgba(239,68,68,.08);color:var(--danger)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>

</div>

<div class="il"><div class="il-icon" style="background:rgba(6,182,212,.1)">🔄</div><div class="il-text"><div class="il-l">最后同步</div><div class="il-v">2026-07-25 09:30</div></div><div class="il-arrow">&#8250;</div></div>
<div class="il"><div class="il-icon" style="background:rgba(16,185,129,.1)">✅</div><div class="il-text"><div class="il-l">自动回复</div><div class="il-v" style="color:var(--success)">已开启 · 规则 12 条</div></div><div class="il-arrow">&#8250;</div></div>
<div class="il"><div class="il-icon" style="background:rgba(245,158,11,.1)">⚡</div><div class="il-text"><div class="il-l">当前状态</div><div class="il-v">运行正常 · API 响应 < 800ms</div></div><div class="il-arrow">&#8250;</div></div>
<div class="il"><div class="il-icon" style="background:rgba(139,92,246,.1)">💰</div><div class="il-text"><div class="il-l">钱包余额</div><div class="il-v">¥2,180.50</div></div><div class="il-arrow">&#8250;</div></div>
</div>
<div class="expire-bar">
<div class="expire-label">Cookie 剩余时间</div>

<div class="expire-info">70% · 还剩约 28 天</div>
</div>
<div class="actions">

</div>
</div>
</div>
</body></html>
