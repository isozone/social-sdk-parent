<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>添加账号 - AI 鱼多宝</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,'PingFang SC','SF Pro Display',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}:root{--brand:#4f46e5;--violet:#7c3aed;--cyan:#22d3ee;--bg:#f5f5f7;--t1:#111827;--t2:#6b7280;--t3:#9ca3af;--border:#e5e7eb;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.st{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--t1)}.ct{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.ct::-webkit-scrollbar{display:none}.hd{padding:10px 16px 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}.bk{font-size:22px;color:var(--t2);cursor:pointer;padding:4px}.pt{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--t1);margin-right:28px}.btn-sub{font-size:12px;color:var(--brand);font-weight:600}
.info-step{background:#fff;margin:16px;padding:20px 16px;border-radius:16px;border:1px solid var(--border);text-align:center}
.step-icon{font-size:48px;margin-bottom:12px}
.step-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:8px}
.step-desc{font-size:13px;color:var(--t2);line-height:1.6}
.cookie-input{background:#fff;margin:12px 16px;padding:16px;border-radius:16px;border:1px solid var(--border)}
.cookie-label{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cookie-area{width:100%;min-height:100px;border:2px dashed #d1d5db;border-radius:14px;padding:14px;font-size:12px;color:#9ca3af;outline:none;font-family:monospace;line-height:1.6;resize:none;background:#fafafa;transition:all .2s}
.cookie-area:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.08)}
.cookie-hint{font-size:11px;color:var(--text-3);margin-top:8px;display:flex;align-items:center;gap:4px}
.hint-tip{font-size:12px;color:var(--t3);padding:12px;background:#f8fafc;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border)}
.hint-tip span{font-size:20px}
.btn-primary{width:calc(100% - 32px);margin:16px;padding:14px;background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,.3);transition:transform .15s}
.btn-primary:active{transform:scale(.98)}
.qr-login{background:#fff;margin:16px;padding:24px 16px;border-radius:16px;border:1px solid var(--border);text-align:center}
.qr-placeholder{width:200px;height:200px;margin:16px auto;background:#f8fafc;border:2px dashed #d1d5db;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:64px;color:var(--t3)}
.switch-tab{display:flex;background:#fff;margin:12px 16px 0;border-radius:14px;padding:4px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--t2);border-radius:11px;cursor:pointer;transition:all .2s}
.tab-btn.active{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<div class="phone safe-bottom">
<div class="island"></div><div class="st"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
<div class="ct">
<div class="hd"><div class="bk">&#8592;</div><div class="pt">添加账号</div><button class="btn-sub">提交</button></div>
<div class="switch-tab"><div class="tab-btn active">Cookie 登录</div><div class="tab-btn">扫码登录</div></div>
<div class="info-step">
<div class="step-icon">🍪</div>
<div class="step-title">Cookie 登录</div>
<div class="step-desc">从浏览器复制 Cookie 粘贴到下方</div>
</div>
<div class="cookie-input">
<div class="cookie-label">📋 粘贴 Cookie</div>
<textarea class="cookie-area" placeholder="在此粘贴 Cookie 字符串...&#10;&#10;提示：打开浏览器 DevTools → Network → 任意请求 → 复制 Request Headers 中的 Cookie"></textarea>
<div class="cookie-hint">💡 从浏览器 DevTools 复制 _m_h5_tk 和 _m_h5_tk_token</div>
</div>
<div class="cookie-input">
<div class="cookie-label">📝 账号备注</div>
<input type="text" placeholder="给这个账号起个名字" style="width:100%;height:44px;border:1px solid #e8e8e8;border-radius:12px;padding:0 14px;font-size:14px;outline:none;background:#fafafa">
</div>
<div class="hint-tip"><span>⚠️</span><span>登录前请确保账号处于安全状态，避免影响交易</span></div>
<button class="btn-primary">验证并添加</button>
<div class="qr-login">
<div class="step-icon">📱</div>
<div class="step-title">扫码登录（P1）</div>
<div class="step-desc">等待开发实现</div>
<div class="qr-placeholder">📷</div>
</div>
</div>
</div>
</body></html>
