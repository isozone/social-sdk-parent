<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>商品详情 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
/* Top nav */
.detail-head{padding:10px 16px 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
.back{font-size:22px;color:var(--text-2);cursor:pointer;padding:4px}
.detail-title{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--text-1);margin-right:28px}
.more-btn{font-size:20px;color:var(--text-2);cursor:pointer}
/* Image carousel */
.carousel{position:relative;background:#fff;padding-top:100%;overflow:hidden}
.carousel-slides{position:absolute;inset:0;display:flex;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.carousel-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px}
.carousel-slide:nth-child(1){background:linear-gradient(135deg,#e0e7ff,#f0e6ff)}
.carousel-slide:nth-child(2){background:linear-gradient(135deg,#cffafe,#e0f2fe)}
.carousel-slide:nth-child(3){background:linear-gradient(135deg,#fef3c7,#fde68a)}
.carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.carousel-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5);transition:all .3s}.carousel-dot.active{width:18px;background:#fff}
/* Price header */
.price-section{background:#fff;padding:16px;border-bottom:1px solid var(--border)}
.price-row{display:flex;align-items:baseline;gap:8px}
.current-price{font-size:28px;font-weight:800;color:var(--danger)}
.original-price{font-size:14px;color:var(--text-3);text-decoration:line-through}
.tag-list{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600}
.tag-on{background:rgba(16,185,129,.1);color:var(--success)}.tag-off{background:rgba(156,163,175,.1);color:var(--text-3)}.tag-ai{background:rgba(79,70,229,.1);color:var(--brand)}.tag-polish{background:rgba(245,158,11,.1);color:var(--warning)}.tag-view{background:rgba(6,182,212,.1);color:#0891b2}
/* Stats row */
.stats-row{background:#fff;padding:14px 16px;display:flex;gap:12px;border-bottom:1px solid var(--border)}
.stat-item{flex:1;text-align:center}.stat-value{font-size:18px;font-weight:700;color:var(--text-1)}.stat-label{font-size:11px;color:var(--text-3);margin-top:2px}
.stat-divider{width:1px;background:#f0f0f0}
/* Info section */
.info-section{background:#fff;margin-top:10px;padding:16px;border-bottom:1px solid var(--border)}
.section-title{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info-item{display:flex;flex-direction:column;gap:4px}
.info-label{font-size:12px;color:var(--text-3)}.info-value{font-size:14px;color:var(--text-1);font-weight:500}
.desc-box{margin-top:12px;padding:14px;background:#fafafa;border-radius:14px;font-size:13px;color:var(--text-2);line-height:1.7;border:1px solid #f0f0f0}
/* Status toggle */
.switch-section{background:#fff;margin-top:10px;padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.switch-info{display:flex;flex-direction:column;gap:2px}.switch-label{font-size:15px;font-weight:600;color:var(--text-1)}.switch-desc{font-size:12px;color:var(--text-3)}
.toggle{width:48px;height:28px;border-radius:14px;background:#e5e7eb;position:relative;cursor:pointer;transition:background .3s}.toggle.on{background:var(--brand)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .3s cubic-bezier(.16,1,.3,1)}
.toggle.on::after{left:22px}
/* Bottom actions */
.bottom-actions{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 16px 22px;display:flex;gap:10px}
.bottom-btn{flex:1;padding:12px 0;border-radius:14px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:transform .15s;text-align:center}
.bottom-btn:active{transform:scale(.97)}
.bottom-btn.polish{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.3)}
.bottom-btn.shelf{background:#f3f4f6;color:var(--text-2)}
.bottom-btn.shelf-off{background:rgba(245,158,11,.08);color:var(--warning)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <div class="detail-head">
      <div class="back">&#8592;</div>
      <div class="detail-title">商品详情</div>
      <div class="more-btn">&#8942;</div>
    </div>
    <!-- Carousel -->
    <div class="carousel"><div class="carousel-slides">
      <div class="carousel-slide">📱</div>
      <div class="carousel-slide">🔍</div>
      <div class="carousel-slide">✨</div>
    </div><div class="carousel-dots"><div class="carousel-dot active"></div><div class="carousel-dot"></div><div class="carousel-dot"></div></div></div>
    <!-- Price & tags -->
    <div class="price-section"><div class="price-row"><span class="current-price">3,299</span><span class="original-price">¥4,899</span></div><div class="tag-list">
      <span class="tag tag-on">在售中</span><span class="tag tag-ai">AI 优化</span><span class="tag tag-polish">曝光 1,280</span><span class="tag tag-view">收藏 12</span>
    </div></div>
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-item"><div class="stat-value">1,280</div><div class="stat-label">曝光</div></div>
      <div class="stat-divider"></div>
      <div class="stat-item"><div class="stat-value">432</div><div class="stat-label">浏览</div></div>
      <div class="stat-divider"></div>
      <div class="stat-item"><div class="stat-value">3</div><div class="stat-label">已售</div></div>
      <div class="stat-divider"></div>
      <div class="stat-item"><div class="stat-value">12</div><div class="stat-label">收藏</div></div>
    </div>
    <!-- Info grid -->
    <div class="info-section"><div class="section-title">📋 商品参数</div><div class="info-grid">
      <div class="info-item"><span class="info-label">商品 ID</span><span class="info-value">#P-28491</span></div>
      <div class="info-item"><span class="info-label">所属账号</span><span class="info-value">闲鱼主力号</span></div>
      <div class="info-item"><span class="info-label">分类</span><span class="info-value">二手数码 / 手机</span></div>
      <div class="info-item"><span class="info-label">成色</span><span class="info-value">9 成新</span></div>
      <div class="info-item"><span class="info-label">库存</span><span class="info-value">剩余 7 件</span></div>
      <div class="info-item"><span class="info-label">发布时间</span><span class="info-value">2026-07-10</span></div>
    </div></div>
    <!-- Description -->
    <div class="info-section"><div class="section-title">📝 商品描述</div><div class="desc-box">远峰蓝 256G，国行正品，购于 2024 年 3 月，电池效率 94%，无拆无修。配件齐全：原装充电器、保护壳、钢化膜已贴。正常使用痕迹轻微，整体状态很好。</div></div>
    <!-- Auto reply toggle -->
    <div class="switch-section"><div class="switch-info"><span class="switch-label">自动回复</span><span class="switch-desc">此商品开启 AI 自动回复</span></div><div class="toggle on"></div></div>
    <!-- Bottom actions -->
    <div class="bottom-actions">
      <button class="bottom-btn shelf shelf-off">下架</button>
      <button class="bottom-btn polish">✨ 擦亮一次</button>
    </div>
  </div>
</div>
</body>
</html>
