<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - AI 鱼多宝</title>
<link rel="stylesheet" href="../_design-system.css">
<style>
.hero-content{padding-top:56px;position:relative;z-index:1}
.avatar-circle{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px}
.greet-text{font-size:13px;color:rgba(255,255,255,.7)}
.name-text{font-size:28px;font-weight:800;color:#fff;margin-top:4px}
.msg-text{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px;margin:-20px 16px 0;position:relative;z-index:2}
.kpi-card{background:var(--bg-card);border-radius:16px;padding:18px 14px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.kpi-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:22px}
.kpi-value{font-size:22px;font-weight:800;color:var(--text-primary)}
.kpi-unit{font-size:11px;color:var(--text-tertiary)}
.kpi-trend{font-size:11px;margin-top:4px;font-weight:600}
.trend-up{color:var(--success)}.trend-down{color:var(--danger)}
.account-list{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.account-card{background:var(--bg-card);border-radius:16px;padding:16px;border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.account-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0}
.account-info{flex:1;min-width:0}
.account-name{font-size:16px;font-weight:700;color:var(--text-primary)}
.account-desc{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.account-status{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score{font-size:16px;font-weight:800;color:var(--success)}
.tag{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600}
.tag-success{background:rgba(16,185,129,.1);color:#10b981}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px;margin-top:12px}
.action-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.action-icon{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 4px 16px rgba(0,0,0,.06);transition:transform .2s}
.action-label{font-size:12px;color:var(--text-secondary);font-weight:500}
.icon-purple{background:linear-gradient(135deg,rgba(79,70,229,.12),rgba(124,58,237,.06))}
.icon-green{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(34,197,94,.06))}
.icon-amber{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(239,68,68,.06))}
.icon-cyan{background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(59,130,246,.06))}
.tab-bar{bottom:0}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <div class="page-content">
    <div class="hero-section">
      <div class="hero-content">
        <div class="avatar-circle">🐟</div>
        <div class="greet-text">下午好，管理员</div>
        <div class="name-text">AI 鱼多宝</div>
        <div class="msg-text">今日经营数据持续向好 · 3 个账号运行中</div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(79,70,229,.1);color:#4f46e5">📦</div>
        <div class="kpi-value">23<span class="kpi-unit">笔</span></div>
        <div class="kpi-trend trend-up">↑ 12%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(34,211,238,.1);color:#0891b2">💬</div>
        <div class="kpi-value">156<span class="kpi-unit">条</span></div>
        <div class="kpi-trend trend-down">↓ 5%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(245,158,11,.1);color:#d97706">🛒</div>
        <div class="kpi-value">8<span class="kpi-unit">件</span></div>
        <div class="kpi-trend trend-up">↑ 3%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(16,185,129,.1);color:#10b981">✅</div>
        <div class="kpi-value">92<span class="kpi-unit">%</span></div>
        <div class="kpi-trend trend-up">↑ 8%</div>
      </div>
    </div>

    <div class="section-header">
      <div><div class="section-title">账号健康</div><div class="section-subtitle">当前 3 个账号运行中</div></div>
      <a class="section-link" href="../accounts/list.html">管理 ></a>
    </div>

    <div class="account-list">
      <div class="account-card">
        <div class="account-icon" style="background:var(--gradient-brand)">🐟</div>
        <div class="account-info"><div class="account-name">闲鱼-主力号</div><div class="account-desc">在线 · 自动回复已开启 · 156 件商品</div></div>
        <div class="account-status"><div class="score">23单</div><div class="tag tag-success">健康</div></div>
      </div>
      <div class="account-card">
        <div class="account-icon" style="background:var(--gradient-cyan)">⚡</div>
        <div class="account-info"><div class="account-name">闲鱼-副业号</div><div class="account-desc">在线 · 自动回复已开启 · 89 件商品</div></div>
        <div class="account-status"><div class="score">8单</div><div class="tag tag-success">健康</div></div>
      </div>
    </div>

    <div class="section-header"><div class="section-title">快捷操作</div></div>
    <div class="quick-actions">
      <div class="action-item"><div class="action-icon icon-purple">🔄</div><span class="action-label">同步商品</span></div>
      <div class="action-item"><div class="action-icon icon-green">✨</div><span class="action-label">批量擦亮</span></div>
      <div class="action-item"><div class="action-icon icon-amber">🛒</div><span class="action-label">发新商品</span></div>
      <div class="action-item"><div class="action-icon icon-cyan">🔔</div><span class="action-label">同步消息</span></div>
    </div>
  </div>

  <div class="tab-bar safe-bottom">
    <div class="tab-item active"><span class="tab-icon">📊</span><span class="tab-label">首页</span></div>
    <div class="tab-item"><span class="tab-icon">💬</span><span class="tab-label">消息</span></div>
    <div class="tab-item"><span class="tab-icon">🛒</span><span class="tab-label">商品</span></div>
    <div class="tab-item"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>
</body>
</html>
