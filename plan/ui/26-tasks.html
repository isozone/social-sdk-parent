<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>监控任务 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
/* Header */
.task-header{background:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.back-btn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-2);cursor:pointer;background:#f9fafb}
.back-btn:active{background:#f0f0f0}
.task-title{flex:1;text-align:left;font-size:17px;font-weight:600;color:var(--text-1)}
.add-btn{padding:8px 16px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.add-btn:active{opacity:.9}
/* Stats Row */
.task-stats{display:flex;gap:8px;padding:14px 16px}
.stat-pill{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.stat-num{font-size:22px;font-weight:800;color:var(--brand)}.stat-label{font-size:11px;color:var(--text-3);margin-top:2px}
.stat-pill.success .stat-num{color:var(--success)}.stat-pill.warning .stat-num{color:var(--warning)}.stat-pill.danger .stat-num{color:var(--danger)}
/* Task List */
.task-list{padding:0 16px 16px}
.task-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.task-card:active{transform:scale(.98)}
.task-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.task-name{font-size:15px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:8px}
.task-name span:first-child{font-size:18px}
.task-switch{position:relative;width:44px;height:24px;border-radius:12px;cursor:pointer;transition:background .2s}
.task-switch.on{background:var(--brand)}
.task-switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.task-switch.on::after{left:23px}
.task-meta{display:flex;gap:12px;margin-bottom:8px;font-size:12px;color:var(--text-3)}
.task-meta-item{display:flex;align-items:center;gap:4px}
.task-log{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f9fafb;border-radius:10px;font-size:12px;color:var(--text-2)}
.task-log-icon{font-size:14px}
.task-actions{display:flex;gap:8px;margin-top:10px}
.task-action-btn{flex:1;padding:8px;border-radius:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-2)}
.task-action-btn:active{background:#f9fafb}
.task-action-btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none}
/* Status Tags */
.status-badge{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
.badge-success{background:rgba(16,185,129,.1);color:var(--success)}.badge-running{background:rgba(79,70,229,.1);color:var(--brand)}.badge-failed{background:rgba(239,68,68,.1);color:var(--danger)}.badge-pending{background:rgba(107,114,128,.1);color:var(--text-3)}
/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;padding:80px 40px;text-align:center}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.5}
.empty-title{font-size:16px;font-weight:600;color:var(--text-1);margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--text-3);line-height:1.6}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <!-- Header -->
    <div class="task-header">
      <div class="back-btn">&#8592;</div>
      <div class="task-title">监控任务</div>
      <button class="add-btn">+ 新建</button>
    </div>
    <!-- Stats -->
    <div class="task-stats">
      <div class="stat-pill success"><div class="stat-num">8</div><div class="stat-label">运行中</div></div>
      <div class="stat-pill"><div class="stat-num" style="color:var(--text-2)">2</div><div class="stat-label">已暂停</div></div>
      <div class="stat-pill warning"><div class="stat-num">1</div><div class="stat-label">异常</div></div>
      <div class="stat-pill danger"><div class="stat-num">3</div><div class="stat-label">失败</div></div>
    </div>
    <!-- Task List -->
    <div class="task-list">
      <div class="task-card">
        <div class="task-top">
          <div class="task-name"><span>&#128269;</span> 商品同步检查</div>
          <div class="task-switch on"></div>
        </div>
        <div class="task-meta">
          <div class="task-meta-item">&#9200; 每 30 分钟</div>
          <div class="task-meta-item">上次：10:30</div>
        </div>
        <div class="task-log"><span class="task-log-icon" style="color:var(--success)">&#10003;</span><span>同步完成 · 耗时 12s · 更新 15 个商品</span></div>
        <div class="task-actions">
          <button class="task-action-btn primary">立即执行</button>
          <button class="task-action-btn">查看日志</button>
          <button class="task-action-btn">编辑</button>
        </div>
      </div>
      <div class="task-card">
        <div class="task-top">
          <div class="task-name"><span>&#128230;</span> 自动发货触发</div>
          <div class="task-switch on"></div>
        </div>
        <div class="task-meta">
          <div class="task-meta-item">&#9200; 实时</div>
          <div class="task-meta-item">今日：42 次</div>
        </div>
        <div class="task-log"><span class="task-log-icon" style="color:var(--success)">&#10003;</span><span>正常 · 最后执行 09:15</span></div>
        <div class="task-actions">
          <button class="task-action-btn primary">手动触发</button>
          <button class="task-action-btn">查看日志</button>
          <button class="task-action-btn">编辑</button>
        </div>
      </div>
      <div class="task-card">
        <div class="task-top">
          <div class="task-name"><span>&#128221;</span> 消息聚合推送</div>
          <div class="task-switch on"></div>
        </div>
        <div class="task-meta">
          <div class="task-meta-item">&#9200; 每小时</div>
          <div class="task-meta-item">下次：11:00</div>
        </div>
        <div class="task-log"><span class="task-log-icon" style="color:var(--warning)">&#9888;</span><span>延迟 5 分钟 · 队列积压 23 条</span></div>
        <div class="task-actions">
          <button class="task-action-btn primary">立即执行</button>
          <button class="task-action-btn">查看日志</button>
          <button class="task-action-btn">编辑</button>
        </div>
      </div>
      <div class="task-card">
        <div class="task-top">
          <div class="task-name"><span>&#128737;</span> 价格波动监控</div>
          <div class="task-switch on"></div>
        </div>
        <div class="task-meta">
          <div class="task-meta-item">&#9200; 每日 08:00</div>
          <div class="task-meta-item">追踪：128 个关键词</div>
        </div>
        <div class="task-log"><span class="task-log-icon" style="color:var(--danger)">&#10060;</span><span>API 限流 · 上次失败 08:15</span></div>
        <div class="task-actions">
          <button class="task-action-btn">重试</button>
          <button class="task-action-btn">查看日志</button>
          <button class="task-action-btn">编辑</button>
        </div>
      </div>
      <div class="task-card">
        <div class="task-top">
          <div class="task-name"><span>&#128235;</span> 日报生成</div>
          <div class="task-switch"></div>
        </div>
        <div class="task-meta">
          <div class="task-meta-item">&#9200; 每日 23:00</div>
          <div class="task-meta-item">状态：已暂停</div>
        </div>
        <div class="task-log"><span class="task-log-icon" style="color:var(--text-3)">&#9203;</span><span>未执行 · 明天 23:00 将开始</span></div>
        <div class="task-actions">
          <button class="task-action-btn">启用</button>
          <button class="task-action-btn">查看日志</button>
          <button class="task-action-btn">编辑</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
