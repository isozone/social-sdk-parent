<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI 运营 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
/* Header */
.ops-header{background:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.back-btn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-2);cursor:pointer;background:#f9fafb}
.back-btn:active{background:#f0f0f0}
.ops-title{flex:1;text-align:left;font-size:17px;font-weight:600;color:var(--text-1)}
/* Section Card */
.ops-section{margin:14px 16px;background:#fff;border-radius:18px;padding:18px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.ops-section-title{font-size:15px;font-weight:700;color:var(--text-1);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ops-section-title span{font-size:18px}
/* Batch Create Progress */
.batch-progress{margin-bottom:14px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-label{font-size:14px;font-weight:600;color:var(--text-1)}
.progress-pct{font-size:14px;font-weight:700;color:var(--brand)}
.progress-bar{height:8px;background:#f3f4f6;border-radius:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .3s}
.progress-detail{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:6px}
.batch-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc}
.batch-item:last-child{border-bottom:none}
.batch-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.batch-icon.success{background:rgba(16,185,129,.1)}.batch-icon.running{background:rgba(79,70,229,.1)}.batch-icon.pending{background:#f3f4f6}
.batch-info{flex:1}.batch-name{font-size:14px;font-weight:500;color:var(--text-1)}.batch-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.batch-status{font-size:12px;font-weight:600;white-space:nowrap}
.batch-done{color:var(--success)}.batch-run{color:var(--brand)}.batch-wait{color:var(--text-3)}
/* Multi Sync */
.sync-form{display:flex;flex-direction:column;gap:10px}
.sync-row{display:flex;align-items:center;gap:10px}
.sync-label{font-size:14px;color:var(--text-2);font-weight:500;white-space:nowrap;min-width:60px}
.sync-select{flex:1;height:42px;border:1.5px solid var(--border);border-radius:12px;padding:0 12px;font-size:14px;color:var(--text-1);background:#f9fafb;outline:none}
.sync-btn{padding:10px 20px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;box-shadow:0 2px 10px rgba(79,70,229,.2)}
.sync-btn:active{opacity:.9}
/* Weekly Report */
.report-card{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-radius:14px;padding:14px;border:1px solid rgba(79,70,229,.1)}
.report-week{font-size:13px;font-weight:600;color:var(--brand-2);margin-bottom:10px}
.report-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.report-stat{text-align:center;padding:8px;background:rgba(255,255,255,.7);border-radius:10px}
.report-val{font-size:18px;font-weight:800;color:var(--text-1)}.report-lab{font-size:11px;color:var(--text-3);margin-top:2px}
.report-actions{display:flex;gap:8px;margin-top:12px}
.report-btn{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;border:none}
.report-primary{background:var(--brand-2);color:#fff}
.report-outline{background:#fff;color:var(--brand-2);border:1.5px solid rgba(124,58,237,.2)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <!-- Header -->
    <div class="ops-header">
      <div class="back-btn">&#8592;</div>
      <div class="ops-title">AI 运营中心</div>
    </div>
    <!-- Batch Create Progress -->
    <div class="ops-section">
      <div class="ops-section-title"><span>&#128640;</span> 批量上品任务</div>
      <div class="batch-progress">
        <div class="progress-header"><span class="progress-label">从本地商品同步到闲鱼</span><span class="progress-pct">67%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:67%"></div></div>
        <div class="progress-detail"><span>已完成 20/30 个商品</span><span>预计 2 分钟</span></div>
      </div>
      <div class="batch-item"><div class="batch-icon success">&#10003;</div><div class="batch-info"><div class="batch-name">iPhone 14 Pro Max 256G</div><div class="batch-sub">已上架 · 09:28:15</div></div><div class="batch-status batch-done">成功</div></div>
      <div class="batch-item"><div class="batch-icon running">&#8986;</div><div class="batch-info"><div class="batch-name">MacBook Air M2 256G</div><div class="batch-sub">正在处理...</div></div><div class="batch-status batch-run">同步中</div></div>
      <div class="batch-item"><div class="batch-icon pending">⏳</div><div class="batch-info"><div class="batch-name">AirPods Pro 2</div><div class="batch-sub">等待中</div></div><div class="batch-status batch-wait">排队</div></div>
    </div>
    <!-- Multi Account Sync -->
    <div class="ops-section">
      <div class="ops-section-title"><span>&#128260;</span> 多账号同步</div>
      <div class="sync-form">
        <div class="sync-row"><div class="sync-label">目标账号</div><select class="sync-select"><option>全部 3 个账号</option><option>账号 A</option><option>账号 B</option><option>账号 C</option></select></div>
        <div class="sync-row"><div class="sync-label">同步类型</div><select class="sync-select"><option>商品同步</option><option>价格同步</option><option>库存同步</option></select></div>
        <button class="sync-btn">开始同步</button>
      </div>
    </div>
    <!-- Weekly Report -->
    <div class="ops-section">
      <div class="ops-section-title"><span>&#128202;</span> AI 运营周报</div>
      <div class="report-card">
        <div class="report-week">本周数据概览 (07.19 - 07.25)</div>
        <div class="report-stats">
          <div class="report-stat"><div class="report-val" style="color:var(--brand)">356</div><div class="report-lab">总成交额</div></div>
          <div class="report-stat"><div class="report-val" style="color:var(--success)">42</div><div class="report-lab">成交订单</div></div>
          <div class="report-stat"><div class="report-val" style="color:var(--warning)">1,203</div><div class="report-lab">消息触达</div></div>
        </div>
        <div class="report-actions">
          <button class="report-btn report-primary">查看完整报告</button>
          <button class="report-btn report-outline">导出 PDF</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
