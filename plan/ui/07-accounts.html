<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>账号管理 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:84px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #f0f0f0;display:flex;z-index:80;padding-bottom:8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab-icon{font-size:22px;color:#9ca3af;transition:color .2s}.tab-item.active .tab-icon{color:var(--brand)}
.tab-label{font-size:10px;color:#9ca3af;font-weight:500}.tab-item.active .tab-label{color:var(--brand);font-weight:600}
/* Header */
.acc-head{padding:14px 20px 10px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.acc-title{font-size:22px;font-weight:700;color:var(--text-1)}.add-btn{padding:7px 16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:13px;font-weight:600;border-radius:20px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,.25)}
/* Stats Bar */
.stat-row{display:flex;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border)}
.stat-card{flex:1;text-align:center;padding:12px 8px;border-radius:14px;background:linear-gradient(135deg,#fafafa,#f5f5f7);border:1px solid #f0f0f0}
.stat-num{font-size:24px;font-weight:800;color:var(--brand);line-height:1}.stat-num.green{color:var(--success)}.stat-num.amber{color:var(--warning)}
.stat-label{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500}
/* Cookie Login */
.cookie-section{background:#fff;margin-top:12px;padding:16px;border-bottom:1px solid var(--border)}
.cookie-label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cookie-area{background:#f8fafc;border:1.5px dashed #d1d5db;border-radius:14px;padding:12px 14px;font-size:12px;color:#9ca3af;outline:none;line-height:1.5;min-height:70px;resize:none;font-family:monospace}
.cookie-area:focus{border-color:var(--brand);background:#fff}
.cookie-hint{font-size:11px;color:var(--text-3);margin-top:8px;display:flex;align-items:center;gap:4px}
/* Account Cards */
.acc-list{padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
.acc-card{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.acc-top{display:flex;align-items:center;gap:12px}
.acc-avatar{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.acc-detail{flex:1;min-width:0}.acc-name{font-size:16px;font-weight:700;color:var(--text-1)}.acc-nick{font-size:12px;color:var(--text-3);margin-top:2px}
.acc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%}.dot.online{background:var(--success);box-shadow:0 0 6px rgba(16,185,129,.4)}.dot.warn{background:var(--warning);box-shadow:0 0 6px rgba(245,158,11,.4)}.dot.offline{background:var(--text-3)}
.status-badge.online{background:rgba(16,185,129,.1);color:var(--success)}.status-badge.warn{background:rgba(245,158,11,.1);color:var(--warning)}.status-badge.offline{background:rgba(156,163,175,.1);color:var(--text-3)}
.acc-stats{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid #f8fafc}
.acc-stat{font-size:12px;color:var(--text-2)}.acc-stat strong{color:var(--text-1);font-weight:700;margin-right:3px}
.expire-info{font-size:12px;color:var(--text-3);margin-top:12px;display:flex;align-items:center;gap:6px}
.expire-info strong{color:var(--warning);font-weight:600}
.acc-actions{display:flex;gap:8px;margin-top:14px}
.action-btn{flex:1;padding:10px 0;border-radius:12px;font-size:13px;font-weight:600;text-align:center;border:none;cursor:pointer;transition:transform .15s}
.action-btn:active{transform:scale(.97)}
.action-btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.2)}
.action-btn.secondary{background:#f3f4f6;color:var(--text-2)}
.action-btn.danger{background:rgba(239,68,68,.06);color:var(--danger)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <div class="acc-head"><div class="acc-title">账号管理</div><button class="add-btn">+ 添加</button></div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">3</div><div class="stat-label">总账号</div></div>
      <div class="stat-card"><div class="stat-num green">2</div><div class="stat-label">在线</div></div>
      <div class="stat-card"><div class="stat-num amber">1</div><div class="stat-label">警告</div></div>
    </div>
    <div class="cookie-section">
      <div class="cookie-label">🍪 Cookie 登录</div>
      <textarea class="cookie-area" placeholder="在此粘贴 Cookie 字符串...&#10;&#10;从浏览器 DevTools 复制 _m_h5_tk 和 _m_h5_tk_token"></textarea>
      <div class="cookie-hint">💡 打开闲鱼 App → 我的 → 设置 → 关于闲鱼 → 查看 Cookie</div>
    </div>
    <div class="acc-list">
      <div class="acc-card">
        <div class="acc-top">
          <div class="acc-avatar" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">🚀</div>
          <div class="acc-detail"><div class="acc-name">闲鱼主力号</div><div class="acc-nick">用户昵称：yu88888</div></div>
          <div class="acc-right"><span class="status-badge online"><span class="dot online"></span>在线</span></div>
        </div>
        <div class="acc-stats">
          <div class="acc-stat"><strong>156</strong>商品</div>
          <div class="acc-stat"><strong>12,846</strong>曝光</div>
          <div class="acc-stat"><strong>96 分</strong>健康</div>
        </div>
        <div class="expire-info">Cookie 有效期：<strong>还剩 28 天</strong></div>
        <div class="acc-actions"><button class="action-btn primary">同步</button><button class="action-btn secondary">编辑</button><button class="action-btn danger">删除</button></div>
      </div>
      <div class="acc-card">
        <div class="acc-top">
          <div class="acc-avatar" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">⚡</div>
          <div class="acc-detail"><div class="acc-name">闲鱼副业号</div><div class="acc-nick">用户昵称：seller_2024</div></div>
          <div class="acc-right"><span class="status-badge warn"><span class="dot warn"></span>弱</span></div>
        </div>
        <div class="acc-stats">
          <div class="acc-stat"><strong>89</strong>商品</div>
          <div class="acc-stat"><strong>4,320</strong>曝光</div>
          <div class="acc-stat"><strong>72 分</strong>健康</div>
        </div>
        <div class="expire-info">Cookie 有效期：<strong>还剩 7 天</strong></div>
        <div class="acc-actions"><button class="action-btn primary">刷新 Cookie</button><button class="action-btn secondary">编辑</button><button class="action-btn danger">删除</button></div>
      </div>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab-item"><div class="tab-icon">📊</div><div class="tab-label">首页</div></div>
    <div class="tab-item"><div class="tab-icon">💬</div><div class="tab-label">消息</div></div>
    <div class="tab-item"><div class="tab-icon">🛒</div><div class="tab-label">商品</div></div>
    <div class="tab-item active"><div class="tab-icon">👤</div><div class="tab-label">我的</div></div>
  </div>
</div>
</body>
</html>
