<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>消息会话 - AI 鱼多宝</title>
<style>
@import url('../_design-system.css');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Inter',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.session-header{background:var(--gradient-brand);padding:24px 20px 36px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.session-header::before{content:'';position:absolute;top:-50%;right:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 70%);border-radius:50%}
.session-title-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.session-page-title{font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.1)}
.header-actions{display:flex;gap:12px}
.header-action-btn{color:rgba(255,255,255,.7);font-size:20px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-radius:10px;transition:all .2s}
.header-action-btn:active{transform:scale(.9)}
.account-tabs{display:flex;gap:8px;padding:16px 16px 0;overflow-x:auto}
.account-tab{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);transition:all .2s}
.account-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.search-bar{margin:12px 16px;background:var(--bg-card);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.search-icon{color:var(--text-tertiary)}.search-text{font-size:14px;color:var(--text-tertiary)}
.session-list{padding:0 16px 20px;display:flex;flex-direction:column;gap:10px}
.session-item{background:var(--bg-card);border-radius:var(--radius-md);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;transition:transform .2s}
.session-item:active{transform:scale(.98)}
.session-avatar{position:relative;flex-shrink:0}
.avatar-gradient{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.av-brand{background:var(--gradient-brand)}.av-cyan{background:var(--gradient-cold)}.av-green{background:var(--gradient-success)}.av-warm{background:var(--gradient-warm)}.av-slate{background:var(--gradient-slate)}
.online-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2px solid #fff}
.unread-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.session-info{flex:1;min-width:0}
.session-name{font-size:15px;font-weight:700;color:var(--text-primary)}
.session-msg{font-size:12px;color:var(--text-tertiary);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.session-meta{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:end;gap:6px}
.session-time{font-size:11px;color:var(--text-tertiary)}
.status-tag{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600}
.status-auto{background:rgba(16,185,129,.1);color:var(--success)}.status-manual{background:rgba(156,163,175,.1);color:var(--text-secondary)}.status-new{background:rgba(79,70,229,.1);color:var(--brand)}
.loading{display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text-tertiary);font-size:13px;gap:8px}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:5px;align-items:center"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg><svg width="26" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#fff" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg></span></div>
  <div class="page-content">
    <div class="session-header">
      <div class="session-title-row">
        <div class="session-page-title">消息</div>
        <div class="header-actions">
          <button class="header-action-btn" aria-label="搜索">🔍</button>
          <button class="header-action-btn" aria-label="刷新">🔄</button>
        </div>
      </div>
    </div>
    <div class="account-tabs">
      <div class="account-tab active">全部</div>
      <div class="account-tab">主力号</div>
      <div class="account-tab">副业号</div>
      <div class="account-tab">测试号</div>
    </div>
    <div class="search-bar"><span class="search-icon">🔍</span><span class="search-text">搜索聊天记录...</span></div>
    <div class="session-list">
      <div class="session-item"><div class="session-avatar"><div class="avatar-gradient av-brand">👤</div><div class="online-dot"></div><div class="unread-badge">3</div></div><div class="session-info"><div class="session-name">张三</div><div class="session-msg">你好，这个还能包邮吗？</div></div><div class="session-meta"><div class="session-time">刚刚</div><span class="status-tag status-auto">自动回复</span></div></div>
      <div class="session-item"><div class="session-avatar"><div class="avatar-gradient av-cyan">👩</div><div class="unread-badge">1</div></div><div class="session-info"><div class="session-name">李四</div><div class="session-msg">价格能便宜点吗？</div></div><div class="session-meta"><div class="session-time">10:23</div><span class="status-tag status-manual">未回复</span></div></div>
      <div class="session-item"><div class="session-avatar"><div class="avatar-gradient av-green">👨</div></div><div class="session-info"><div class="session-name">王五</div><div class="session-msg">已经下单了，什么时候发货？</div></div><div class="session-meta"><div class="session-time">09:45</div><span class="status-tag status-new">已读</span></div></div>
      <div class="session-item"><div class="session-avatar"><div class="avatar-gradient av-warm">👧</div></div><div class="session-info"><div class="session-name">赵六</div><div class="session-msg">有现货吗？要白色的</div></div><div class="session-meta"><div class="session-time">昨天</div><span class="status-tag status-auto">自动回复</span></div></div>
      <div class="session-item"><div class="session-avatar"><div class="avatar-gradient av-slate">🧑</div></div><div class="session-info"><div class="session-name">钱七</div><div class="session-msg">谢谢，东西收到了</div></div><div class="session-meta"><div class="session-time">昨天</div><span class="status-tag status-auto">已完成</span></div></div>
    </div>
    <div class="loading">上拉加载更多...</div>
  </div>
  <div class="tab-bar safe-bottom">
    <div class="tab-item"><span class="tab-icon">📊</span><span class="tab-label">首页</span></div>
    <div class="tab-item active"><span class="tab-icon">💬</span><span class="tab-label">消息</span></div>
    <div class="tab-item"><span class="tab-icon">🛒</span><span class="tab-label">商品</span></div>
    <div class="tab-item"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>
</body>
</html>
