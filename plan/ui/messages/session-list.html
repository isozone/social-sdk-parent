<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>消息会话 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Inter',system-ui,sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone-frame{width:393px;height:852px;border-radius:54px;background:#f5f5f7;position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:13px;font-weight:600;color:#111827}
.page-content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.page-content::-webkit-scrollbar{display:none}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Nav */
.nav-bar{position:absolute;top:58px;left:0;right:0;height:44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #f3f4f6;z-index:50}
.nav-title{font-size:17px;font-weight:700;color:#111827}
.nav-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f5f5f7;cursor:pointer;transition:all .2s}
.nav-btn:active{transform:scale(.92);background:#e5e7eb}

/* Header Gradient */
.messages-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:20px 16px 24px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.messages-header::before{content:'';position:absolute;top:-40%;right:-10%;width:200px;height:200px;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%);border-radius:50%}
.header-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.header-title{font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.1)}
.sync-btn{height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .2s}
.sync-btn:active{transform:scale(.95)}

/* Stats Cards */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-18px 16px 0;position:relative;z-index:2}
.stat-card{background:#fff;border-radius:16px;padding:14px 12px;text-align:center;border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.stat-num{font-size:20px;font-weight:800;color:#111827;line-height:1}
.stat-label{font-size:10px;color:#9ca3af;margin-top:4px;font-weight:500}

/* Account Tabs */
.account-tabs{display:flex;gap:8px;padding:16px 16px 8px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.account-tabs::-webkit-scrollbar{display:none}
.acc-tab{flex:1;white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:500;color:#6b7280;background:#fff;border:1px solid #e5e7eb;cursor:pointer;transition:all .2s;text-align:center;flex-shrink:0}
.acc-tab.active{background:#4f46e5;color:#fff;border-color:#4f46e5;box-shadow:0 4px 16px rgba(79,70,229,.25)}
.acc-tab:active{transform:scale(.96)}

/* Search */
.search-bar{margin:0 16px 12px;background:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.search-icon{color:#9ca3af;font-size:16px}
.search-text{font-size:13px;color:#9ca3af}

/* Session List */
.session-list{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.session-item{background:#fff;border-radius:16px;padding:14px 16px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.03);display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s cubic-bezier(.16,1,.3,1);text-decoration:none}
.session-item:active{transform:scale(.98);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.session-avatar{position:relative;flex-shrink:0}
.avatar-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.online-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#10b981;border:2px solid #fff}
.unread-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.session-info{flex:1;min-width:0}
.session-name{font-size:15px;font-weight:700;color:#111827}
.session-msg{font-size:12px;color:#9ca3af;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.session-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.session-time{font-size:10px;color:#9ca3af}
.session-status{padding:3px 8px;border-radius:6px;font-size:9px;font-weight:600}
.status-auto{background:rgba(16,185,129,.1);color:#10b981}
.status-new{background:rgba(79,70,229,.1);color:#4f46e5}
.status-done{background:rgba(156,163,175,.1);color:#6b7280}

/* TabBar */
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid #f3f4f6;display:flex;z-index:80;padding-bottom:8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .15s}
.tab-item:active{transform:scale(.9)}
.tab-icon{font-size:22px;line-height:1}
.tab-label{font-size:10px;color:#9ca3af;font-weight:400;transition:all .2s}
.tab-item.active .tab-icon{color:#4f46e5}
.tab-item.active .tab-label{color:#4f46e5;font-weight:600}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <!-- Nav -->
  <div class="nav-bar">
    <button onclick="location.href='../dashboard/index.html'" style="background:none;border:none;font-size:15px;color:#4f46e5;font-weight:600;cursor:pointer;font-family:inherit">← 返回</button>
    <span class="nav-title">消息</span>
    <div class="nav-btn">⋮</div>
  </div>

  <div class="page-content">
    <!-- Header -->
    <div class="messages-header">
      <div class="header-row">
        <div class="header-title">所有会话</div>
        <button class="sync-btn" onclick="window.location.reload()">🔄 同步</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" style="color:#ef4444">3</div>
        <div class="stat-label">未读消息</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#4f46e5">12</div>
        <div class="stat-label">活跃会话</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#10b981">8</div>
        <div class="stat-label">已自动回复</div>
      </div>
    </div>

    <!-- Account Tabs -->
    <div class="account-tabs">
      <div class="acc-tab active">全部 (12)</div>
      <div class="acc-tab">主力号 (7)</div>
      <div class="acc-tab">副业号 (4)</div>
      <div class="acc-tab">测试号 (1)</div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <span class="search-text">搜索聊天记录、联系人...</span>
    </div>

    <!-- Sessions -->
    <div class="session-list">
      <a href="chat.html" class="session-item">
        <div class="session-avatar">
          <div class="avatar-circle" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">👤</div>
          <div class="online-dot"></div>
          <div class="unread-badge">3</div>
        </div>
        <div class="session-info">
          <div class="session-name">张三</div>
          <div class="session-msg">你好，这个还能包邮吗？</div>
        </div>
        <div class="session-meta">
          <span class="session-time">刚刚</span>
          <span class="session-status status-auto">自动回复</span>
        </div>
      </a>

      <a href="chat.html" class="session-item">
        <div class="session-avatar">
          <div class="avatar-circle" style="background:linear-gradient(135deg,#22d3ee,#3b82f6)">👩</div>
          <div class="unread-badge">1</div>
        </div>
        <div class="session-info">
          <div class="session-name">李四</div>
          <div class="session-msg">价格能便宜点吗？</div>
        </div>
        <div class="session-meta">
          <span class="session-time">10:23</span>
          <span class="session-status status-new">未回复</span>
        </div>
      </a>

      <a href="chat.html" class="session-item">
        <div class="session-avatar">
          <div class="avatar-circle" style="background:linear-gradient(135deg,#10b981,#22c55e)">👨</div>
        </div>
        <div class="session-info">
          <div class="session-name">王五</div>
          <div class="session-msg">已经下单了，什么时候发货？</div>
        </div>
        <div class="session-meta">
          <span class="session-time">09:45</span>
          <span class="session-status status-new">已读</span>
        </div>
      </a>

      <a href="chat.html" class="session-item">
        <div class="session-avatar">
          <div class="avatar-circle" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">👧</div>
        </div>
        <div class="session-info">
          <div class="session-name">赵六</div>
          <div class="session-msg">有现货吗？要白色的</div>
        </div>
        <div class="session-meta">
          <span class="session-time">昨天</span>
          <span class="session-status status-auto">自动回复</span>
        </div>
      </a>

      <a href="chat.html" class="session-item">
        <div class="session-avatar">
          <div class="avatar-circle" style="background:linear-gradient(135deg,#64748b,#94a3b8)">🧑</div>
        </div>
        <div class="session-info">
          <div class="session-name">钱七</div>
          <div class="session-msg">谢谢，东西收到了</div>
        </div>
        <div class="session-meta">
          <span class="session-time">昨天</span>
          <span class="session-status status-done">已完成</span>
        </div>
      </a>

      <a href="chat.html" class="session-item">
        <div class="session-avatar">
          <div class="avatar-circle" style="background:linear-gradient(135deg,#ec4899,#f43f5e)">💁</div>
        </div>
        <div class="session-info">
          <div class="session-name">孙八</div>
          <div class="session-msg">请问这款有黑色吗</div>
        </div>
        <div class="session-meta">
          <span class="session-time">周一</span>
          <span class="session-status status-done">已完成</span>
        </div>
      </a>
    </div>
  </div>

  <!-- TabBar -->
  <div class="tab-bar safe-bottom">
    <div class="tab-item" onclick="location.href='../dashboard/index.html'">
      <span class="tab-icon">📊</span>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab-item active">
      <span class="tab-icon">💬</span>
      <span class="tab-label">消息</span>
    </div>
    <div class="tab-item" onclick="location.href='../products/list.html'">
      <span class="tab-icon">🛒</span>
      <span class="tab-label">商品</span>
    </div>
    <div class="tab-item" onclick="location.href='../profile/index.html'">
      <span class="tab-icon">👤</span>
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>
</body>
</html>
