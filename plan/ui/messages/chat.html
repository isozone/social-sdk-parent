<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聊天窗口 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Inter',system-ui,sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone-frame{width:393px;height:852px;border-radius:54px;background:#f5f5f7;position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.18)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:13px;font-weight:600;color:#111827}
.page-content{position:absolute;top:58px;left:0;right:0;bottom:72px;overflow-y:auto;overflow-x:hidden;padding:12px 16px}
.page-content::-webkit-scrollbar{display:none}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}

/* Nav */
.nav-bar{position:absolute;top:58px;left:0;right:0;height:44px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e5e7eb;z-index:50}
.back-btn{display:flex;align-items:center;gap:4px;font-size:15px;color:#4f46e5;cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600}
.nav-title{font-size:17px;font-weight:700;color:#111827}
.nav-more{font-size:20px;color:#6b7280;background:none;border:none;cursor:pointer;padding:8px}

/* Chat Area */
.msg-time{text-align:center;font-size:11px;color:#9ca3af;padding:10px 0}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.msg-row.outgoing{flex-direction:row-reverse;margin-left:auto}
.chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:#fff}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;word-break:break-word}
.incoming .msg-bubble{background:#fff;border:1px solid #e5e7eb;color:#111827;border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.outgoing .msg-bubble{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-top-right-radius:4px;box-shadow:0 4px 16px rgba(79,70,229,.2)}
.msg-bubble .reply-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:600;margin-top:6px}
.reply-auto{background:rgba(16,185,129,.1);color:#10b981}
.reply-manual{background:rgba(79,70,229,.1);color:#4f46e5}
.order-link{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.15);border-radius:10px;margin-top:6px;font-size:11px}
.order-link-price{font-weight:700;font-size:13px}

/* Typing Indicator */
.typing-indicator{display:flex;gap:8px;align-items:flex-end}
.typing-bubble{padding:12px 16px;border-radius:18px;background:#fff;border:1px solid #e5e7eb;border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.typing-dots{display:flex;gap:4px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:bounce .6s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* Input Bar */
.input-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #e5e7eb;padding:8px 12px;display:flex;align-items:center;gap:8px;z-index:60}
.quick-btn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#f5f5f7;cursor:pointer;transition:all .2s;font-size:16px;border:none}
.quick-btn:active{transform:scale(.9);background:#e5e7eb}
.chat-input{flex:1;height:36px;background:#f5f5f7;border:1px solid #e5e7eb;border-radius:18px;padding:0 14px;font-size:14px;color:#111827;outline:none;transition:all .25s}
.chat-input:focus{border-color:#4f46e5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.send-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(79,70,229,.3);transition:transform .2s;border:none;color:#fff}
.send-btn:active{transform:scale(.9)}
.send-btn svg{width:18px;height:18px}

/* Suggested Replies */
.suggestions{padding:8px 16px;display:flex;gap:6px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.suggestions::-webkit-scrollbar{display:none}
.suggestion-chip{white-space:nowrap;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:500;color:#6b7280;background:#fff;border:1px solid #e5e7eb;cursor:pointer;transition:all .2s;flex-shrink:0}
.suggestion-chip:active{background:#4f46e5;color:#fff;border-color:#4f46e5}
</style>
</head>
<body>
<div class="phone-frame safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 10.5a1 1 0 01-.5-1.86A8 8 0 018 2a8 8 0 018.5 6.64 1 1 0 01-1 1.86A6 6 0 008 4a6 6 0 00-7 6.5z" fill="#10b981"/><path d="M4 7.5a1 1 0 01-.5-1.86A4 4 0 018 2a4 4 0 014.5 3.64 1 1 0 01-1 1.86A2 2 0 008 4a2 2 0 00-4.5 3.5z" fill="#10b981"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="4" width="3" height="8" rx=".5" fill-opacity=".3"/><rect x="5.5" y="2.5" width="3" height="9.5" rx=".5" fill-opacity=".5"/><rect x="10" y="0" width="3" height="12" rx=".5"/></svg>
    <svg width="28" height="12" viewBox="0 0 28 12"><rect x=".5" y=".5" width="23" height="11" rx="3" stroke="#000" fill="none"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#10b981"/></svg>
  </span></div>

  <!-- Nav -->
  <div class="nav-bar">
    <button class="back-btn" onclick="location.href='session-list.html'">← 返回</button>
    <span class="nav-title">张三</span>
    <button class="nav-more">⋮</button>
  </div>

  <!-- Chat Messages -->
  <div class="page-content">
    <div class="msg-time">今天 14:30</div>

    <div class="msg-row incoming">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">👤</div>
      <div class="incoming">
        <div class="msg-bubble">你好，这款Air Force 1还有白色42码吗？</div>
      </div>
    </div>

    <div class="msg-row outgoing">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#10b981,#22c55e)">🐟</div>
      <div class="outgoing">
        <div class="msg-bubble">有的亲！白色42码库存还有5双，现在下单今天可以发货哦～<div class="reply-tag reply-auto">🤖 自动回复</div></div>
      </div>
    </div>

    <div class="msg-row incoming">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">👤</div>
      <div class="incoming">
        <div class="msg-bubble">可以便宜点吗？我看别人卖280</div>
      </div>
    </div>

    <div class="msg-row outgoing">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#10b981,#22c55e)">🐟</div>
      <div class="outgoing">
        <div class="msg-bubble">这款是全新正品带盒的，价格确实已经很实惠了 😊 如果您今天下单我可以送您一双运动袜<div class="order-link"><span>📦 Nike AF1 空军一号</span><span class="order-link-price">¥299</span></div></div>
      </div>
    </div>

    <div class="msg-row incoming">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">👤</div>
      <div class="incoming">
        <div class="msg-bubble">好的，那我下单了</div>
      </div>
    </div>

    <div class="msg-row outgoing">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#10b981,#22c55e)">🐟</div>
      <div class="outgoing">
        <div class="msg-bubble">好的，收到您的订单后我会第一时间为您发货的！<div class="reply-tag reply-manual">✍️ 手动回复</div></div>
      </div>
    </div>

    <div class="msg-time">15:02</div>

    <div class="typing-indicator">
      <div class="chat-avatar" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">👤</div>
      <div class="typing-bubble"><div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>
    </div>
  </div>

  <!-- Suggestions -->
  <div class="suggestions">
    <div class="suggestion-chip">📦 已发货</div>
    <div class="suggestion-chip">🚚 包邮</div>
    <div class="suggestion-chip">💰 不能少</div>
    <div class="suggestion-chip">✅ 现货</div>
    <div class="suggestion-chip">📞 加微信</div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <button class="quick-btn">😊</button>
    <input class="chat-input" placeholder="输入消息...">
    <button class="send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
</body>
</html>
