<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>收藏关注 - AI 鱼多宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#4f46e5;--brand-2:#7c3aed;--accent:#22d3ee;--bg:#f5f5f7;--text-1:#111827;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}
.status-bar{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:#111827}
.content{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
/* Header */
.collect-header{background:#fff;padding:10px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.collect-header-left{display:flex;align-items:center;gap:10px}
.back-btn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-2);cursor:pointer;background:#f9fafb}
.back-btn:active{background:#f0f0f0}
.collect-title{font-size:17px;font-weight:600;color:var(--text-1)}
.sync-btn{padding:8px 14px;border-radius:12px;font-size:12px;font-weight:600;color:var(--brand);background:rgba(79,70,229,.08);border:1.5px solid rgba(79,70,229,.15);cursor:pointer;display:flex;align-items:center;gap:4px}
.sync-btn:active{background:rgba(79,70,229,.15)}
/* Filter Tabs */
.filter-tabs{display:flex;gap:8px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border)}
.filter-chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;color:var(--text-2);background:#f3f4f6;cursor:pointer;transition:all .15s;border:none}
.filter-chip.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.filter-count{margin-left:4px;font-size:11px;opacity:.8}
/* Search */
.search-bar{margin:12px 16px;background:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--border)}
.search-bar span{color:var(--text-3);font-size:16px}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;color:var(--text-1);background:transparent}
.search-bar input::placeholder{color:var(--text-3)}
/* Collect List */
.collect-list{padding:12px 16px}
.collect-item{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03);display:flex;gap:12px}
.collect-item:active{transform:scale(.98)}
.collect-img{width:80px;height:80px;border-radius:14px;background:linear-gradient(135deg,#e0e7ff,#f0e6ff);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.collect-info{flex:1;min-width:0}
.collect-name{font-size:14px;font-weight:500;color:var(--text-1);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collect-price{font-size:17px;font-weight:800;color:var(--danger);margin-top:6px}.collect-price::before{content:'¥'}
.collect-meta{font-size:12px;color:var(--text-3);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.unfav-btn{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;color:var(--danger);background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);cursor:pointer;white-space:nowrap}
/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;padding:60px 40px;text-align:center}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.6}
.empty-title{font-size:16px;font-weight:600;color:var(--text-1);margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--text-3);line-height:1.6}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="phone safe-bottom">
  <div class="island"></div>
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
  <div class="content">
    <!-- Header -->
    <div class="collect-header">
      <div class="collect-header-left">
        <div class="back-btn">&#8592;</div>
        <div class="collect-title">收藏关注</div>
      </div>
      <div class="sync-btn">&#8635; 同步</div>
    </div>
    <!-- Filters -->
    <div class="filter-tabs">
      <button class="filter-chip active">商品<span class="filter-count">24</span></button>
      <button class="filter-chip">用户<span class="filter-count">8</span></button>
      <button class="filter-chip">店铺<span class="filter-count">3</span></button>
    </div>
    <!-- Search -->
    <div class="search-bar">
      <span>&#128269;</span>
      <input type="text" placeholder="搜索收藏的商品、用户或店铺">
    </div>
    <!-- List -->
    <div class="collect-list">
      <div class="collect-item">
        <div class="collect-img">&#127927;</div>
        <div class="collect-info"><div class="collect-name">机械键盘 Keychron Q1 Pro 三模蓝牙 矮轴</div><div class="collect-price">680</div><div class="collect-meta"><span>卖家：键盘爱好者</span><div class="unfav-btn">取消收藏</div></div></div>
      </div>
      <div class="collect-item">
        <div class="collect-img" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe)">&#128187;</div>
        <div class="collect-info"><div class="collect-name">ThinkPad X1 Carbon Gen11 i7-1365U 16G 512G</div><div class="collect-price">4,599</div><div class="collect-meta"><span>卖家：数码小铺</span><div class="unfav-btn">取消收藏</div></div></div>
      </div>
      <div class="collect-item">
        <div class="collect-img" style="background:linear-gradient(135deg,#d1fae5,#a7f3d0)">&#127925;</div>
        <div class="collect-info"><div class="collect-name">Sony WH-1000XM5 头戴式降噪耳机 黑色</div><div class="collect-price">1,899</div><div class="collect-meta"><span>卖家：音效控</span><div class="unfav-btn">取消收藏</div></div></div>
      </div>
      <div class="collect-item">
        <div class="collect-img" style="background:linear-gradient(135deg,#fef3c7,#fde68a)">&#128248;</div>
        <div class="collect-info"><div class="collect-name">小米台灯 Pro 学习办公护眼 国行全新</div><div class="collect-price">199</div><div class="collect-meta"><span>卖家：智能家居店</span><div class="unfav-btn">取消收藏</div></div></div>
      </div>
      <div class="collect-item">
        <div class="collect-img" style="background:linear-gradient(135deg,#fce7f3,#fbcfe8)">&#9992;&#65039;</div>
        <div class="collect-info"><div class="collect-name">Nintendo Switch OLED 日版 含健身环大冒险</div><div class="collect-price">1,650</div><div class="collect-meta"><span>卖家：游戏机之家</span><div class="unfav-btn">取消收藏</div></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
