<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>编辑规则 - AI 鱼多宝</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,'PingFang SC','SF Pro Display',sans-serif;background:#d1d5db;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}:root{--brand:#4f46e5;--violet:#7c3aed;--cyan:#22d3ee;--bg:#f5f5f7;--t1:#111827;--t2:#6b7280;--t3:#9ca3af;--border:#e5e7eb;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}.phone{width:393px;height:852px;border-radius:48px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 3px #d1d5db,0 40px 120px rgba(0,0,0,.2)}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#1a1a2e;border-radius:20px;z-index:100}.st{position:absolute;top:58px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:90;font-size:14px;font-weight:600;color:var(--t1)}.ct{position:absolute;top:58px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.ct::-webkit-scrollbar{display:none}.hd{padding:10px 16px 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}.bk{font-size:22px;color:var(--t2);cursor:pointer;padding:4px}.pt{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--t1);margin-right:28px}.btn-sub{font-size:12px;color:var(--brand);font-weight:600}.sec{background:#fff;margin-top:12px;padding:16px;border-bottom:1px solid var(--border)}.sl{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}.lbl{width:64px;font-size:14px;color:var(--t2);font-weight:500;flex-shrink:0}.inp{flex:1;height:44px;border:1px solid #e8e8e8;border-radius:12px;padding:0 14px;font-size:14px;color:var(--t1);outline:none;background:#fafafa;transition:all .2s}.inp:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}.txtarea{height:120px;padding:12px;line-height:1.6;resize:none}.tag-row{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:7px 14px;border-radius:16px;font-size:13px;background:#f3f4f6;color:var(--t2);border:1px solid transparent;cursor:pointer;transition:all .2s;font-weight:500}.tag.sel{color:var(--brand);background:rgba(79,70,229,.08);border-color:rgba(79,70,229,.15);font-weight:600}.tg2{width:36px;height:20px;border-radius:10px;background:#e5e7eb;position:relative;cursor:pointer;transition:background .3s}.tg2.on{background:var(--brand)}.tg2::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .3s cubic-bezier(.16,1,.3,1)}.tg2.on::after{left:18px}.act{display:flex;gap:10px;padding:16px;position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border)}.ab{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:transform .15s;text-align:center}.ab:active{transform:scale(.97)}.ab.p{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 4px 16px rgba(79,70,229,.3)}.ab.s{background:#f3f4f6;color:var(--t2)}.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<div class="phone safe-bottom"><div class="island"></div><div class="st"><span>9:41</span><span style="font-size:12px">●●●●●</span></div>
<div class="ct">
<div class="hd"><div class="bk">&#8592;</div><div class="pt">编辑规则</div><button class="btn-sub">保存</button></div>
<div class="sec"><div class="sl">基本信息</div>
<div class="row"><label class="lbl">规则名称</label><input class="inp" value="价格咨询回复"></div>
<div class="row"><label class="lbl">匹配类型</label><select class="inp" style="display:flex;align-items:center;justify-content:space-between;color:var(--t1)"><option>包含关键词</option><option>完全匹配</option><option>正则表达式</option></select></div>
<div class="row"><label class="lbl">账号</label><select class="inp" style="display:flex;align-items:center;justify-content:space-between;color:var(--t1)"><option>闲鱼主力号</option><option>闲鱼副业号</option></select></div>
</div>
<div class="sec"><div class="sl">关键词设置 <span style="font-size:12px;color:var(--t3);font-weight:400">输入后按回车添加</span></div>
<div class="tag-row"><div class="tag sel">多少钱</div><div class="tag sel">什么价</div><div class="tag sel">便宜点</div><div class="tag sel">能打折</div><div class="tag">可编辑</div></div>
</div>
<div class="sec"><div class="sl">回复内容</div>
<textarea class="txtarea inp" style="width:100%">这个商品的价格就是标价哦，已经是很划算的了～如果诚心要可以小刀一下哈</textarea>
</div>
<div class="sec"><div class="sl">快捷标签</div>
<div class="tag-row"><div class="tag sel">#价格</div><div class="tag sel">#包邮</div><div class="tag">#成色</div><div class="tag">#发货</div><div class="tag">#售后</div></div>
</div>
<div class="sec"><div class="sl">高级设置</div>
<div class="row"><label class="lbl">状态</label><div class="tg2 on"></div></div>
<div class="row"><label class="lbl">每日上限</label><input class="inp" type="number" value="50"></div>
</div>
<div class="act"><button class="ab s">测试匹配</button><button class="ab p">保存规则</button></div>
</div>
</div>
</body></html>
