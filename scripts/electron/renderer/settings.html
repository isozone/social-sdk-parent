<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>设置 · 闲鱼管理器</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f7fa;color:#303133;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}h1{font-size:18px;margin:0 0 20px}.section{background:#fff;border:1px solid #e4e7ed;border-radius:8px;padding:16px;margin-bottom:16px}.section-title{font-size:13px;font-weight:600;color:#606266;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #e4e7ed}.row:last-child{border-bottom:0}.value{color:#606266;text-align:right;word-break:break-all}input[type=text],input[type=number],select{width:285px;padding:7px 10px;border:1px solid #dcdfe6;border-radius:4px;background:#fff}input:disabled{background:#f2f3f5;color:#909399}.hint{margin-top:8px;color:#909399;font-size:12px;line-height:1.6}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}button{border:0;border-radius:4px;padding:7px 16px;cursor:pointer}.btn-primary{background:#409eff;color:#fff}.btn-default{background:#e4e7ed;color:#303133}.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}.ok{background:#f0f9eb;color:#67c23a}.warn{background:#fdf6ec;color:#e6a23c}
  </style>
</head>
<body>
  <h1>⚙️ 设置</h1>

  <div class="section">
    <div class="section-title">运行模式</div>
    <div class="row">
      <span>后台模式</span>
      <select id="backendMode">
        <option value="local">本地模式（官网版：启动内置后端）</option>
        <option value="cloud">云端模式（App Store：连接远程后台）</option>
      </select>
    </div>
    <div class="row" id="cloudUrlRow">
      <span>云端后台基础 URL</span>
      <input type="text" id="cloudBaseUrl" placeholder="https://your-server.com">
    </div>
    <div class="hint" id="modeHint"></div>
  </div>

  <div class="section">
    <div class="section-title">启动设置</div>
    <div class="row"><span>开机自启</span><input type="checkbox" id="autoStart"></div>
    <div class="row"><span>启动时最小化到托盘</span><input type="checkbox" id="startInTray"></div>
    <div class="row"><span>关闭窗口时最小化到托盘</span><input type="checkbox" id="minimizeToTray"></div>
  </div>

  <div class="section">
    <div class="section-title">本地后端（local 模式）</div>
    <div class="row"><span>监听端口</span><input type="number" id="port" min="1024" max="65535"></div>
    <div class="row"><span>Java 路径</span><input type="text" id="javaPath" placeholder="java 或内置 JRE"></div>
    <div class="hint">官网版使用 local 模式；App Store 版使用 cloud 模式，不在沙盒内启动本地 Java/Chrome/OpenList。</div>
  </div>

  <div class="section">
    <div class="section-title">数据与状态</div>
    <div class="row"><span>数据目录</span><span class="value" id="dataPath">-</span></div>
    <div class="row"><span></span><button class="btn-default" id="openDataBtn">打开数据目录</button></div>
    <div class="row"><span>后端状态</span><span class="value" id="backendStatus">-</span></div>
    <div class="row"><span>App Store 兼容</span><span class="value" id="appStoreSafe">-</span></div>
    <div class="row"><span></span><button class="btn-primary" id="restartBtn">重载后台</button></div>
  </div>

  <div class="actions">
    <button class="btn-default" id="cancelBtn">取消</button>
    <button class="btn-primary" id="saveBtn">保存</button>
  </div>

  <script>
    const api = window.electronAPI;
    let config = {};
    function normalizeBaseUrl(value){return String(value||'').trim().replace(/\/+$/,'')}
    function updateModeUi(){
      const mode=document.getElementById('backendMode').value;
      const cloud=mode==='cloud';
      document.getElementById('cloudUrlRow').style.display=cloud?'flex':'none';
      document.getElementById('port').disabled=cloud;
      document.getElementById('javaPath').disabled=cloud;
      document.getElementById('restartBtn').textContent=cloud?'重载云端后台':'重启本地后端';
      document.getElementById('modeHint').textContent=cloud
        ? '云端模式适合 App Store 分发：Electron 只连接远程后台，不启动本地 Java/Chrome/OpenList。'
        : '本地模式适合官网安装包：Electron 启动内置 Spring Boot 后端，保留本地 Chrome/CDP/OpenList 能力。';
    }
    async function refreshStatus(){
      const st=await api.getBackendStatus();
      document.getElementById('backendStatus').innerHTML=st.mode+' · '+(st.running?'运行中':'未运行')+' · '+(st.baseUrl||'-');
      document.getElementById('appStoreSafe').innerHTML=st.appStoreSafe?'<span class="badge ok">兼容</span>':'<span class="badge warn">官网版能力</span>';
    }
    async function loadConfig(){
      config=await api.getConfig();
      document.getElementById('backendMode').value=config.backendMode||'local';
      document.getElementById('cloudBaseUrl').value=config.cloudBaseUrl||'';
      document.getElementById('autoStart').checked=!!config.autoStart;
      document.getElementById('startInTray').checked=!!config.startInTray;
      document.getElementById('minimizeToTray').checked=!!config.minimizeToTray;
      document.getElementById('port').value=config.lastPort||8080;
      document.getElementById('javaPath').value=config.javaPath||'java';
      document.getElementById('dataPath').textContent=await api.getDataPath();
      updateModeUi();
      await refreshStatus();
    }
    async function save(){
      await api.setConfig('backendMode',document.getElementById('backendMode').value);
      await api.setConfig('cloudBaseUrl',normalizeBaseUrl(document.getElementById('cloudBaseUrl').value));
      await api.setConfig('autoStart',document.getElementById('autoStart').checked);
      await api.setConfig('startInTray',document.getElementById('startInTray').checked);
      await api.setConfig('minimizeToTray',document.getElementById('minimizeToTray').checked);
      await api.setConfig('lastPort',parseInt(document.getElementById('port').value||'8080',10));
      await api.setConfig('javaPath',document.getElementById('javaPath').value||'java');
      await api.restartBackend();
      window.close();
    }
    document.getElementById('backendMode').addEventListener('change',updateModeUi);
    document.getElementById('saveBtn').addEventListener('click',save);
    document.getElementById('cancelBtn').addEventListener('click',()=>window.close());
    document.getElementById('openDataBtn').addEventListener('click',()=>api.openDataFolder());
    document.getElementById('restartBtn').addEventListener('click',async()=>{await api.restartBackend();await refreshStatus()});
    loadConfig();
  </script>
</body>
</html>
