version: '3.8'
services:
  xianyu-manager:
    build: .
    container_name: xianyu-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
      # OpenList 端口：对外分享链接(public-url)与直接访问网盘需可达。
      # 若仅通过后端代理(/api/cloud-storage/openlist/*)使用，可不发布此端口。
      - "5244:5244"
    volumes:
      - ./data:/app/data
      - ./chrome-profiles:/app/chrome-profiles
      - ./logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      # 覆盖 application.yml 中的配置
      - DB_PATH=/app/data/xianyu.db
      # Linux/Docker 默认无头；网页配置页会读取后端当前值并显示为无头模式
      - CHROME_HEADLESS=true
      - CHROME_HEADLESS_MODE=new
      # ── OpenList ──
      # 容器启动后自动安装(镜像内已预置二进制于 /opt/openlist/openlist)并拉起，避免重启后功能不可用
      - OPENLIST_AUTO_START=true
      # 镜像内已预置二进制，跳过运行时 GitHub 下载（受限网络友好）
      - OPENLIST_BINARY_PATH=/opt/openlist/openlist
      # 对外分享/访问基址（改为你的宿主机可达地址）；为空则回落 127.0.0.1（容器外不可达）
      - OPENLIST_PUBLIC_URL=http://192.168.1.252:5244
      # 若镜像内二进制缺失需要运行时下载，可注入可用镜像（逗号分隔），例如:
      # - OPENLIST_DOWNLOAD_BASE_URLS=https://mirror.ghproxy.com/https://github.com/OpenListTeam/OpenList/releases/latest/download,https://github.com/OpenListTeam/OpenList/releases/latest/download
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - seccomp=unconfined  # Chromium 需要
    # 在 container 内启动一个轻量型 Chromium 用于滑块验证
    # 如需更严格的隔离，可单独部署 CDP soler 容器
